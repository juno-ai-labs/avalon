<!doctype html>
<html><head><meta charset="utf-8"><title>Multi-human ad (1:1)</title>
<link rel="stylesheet" href="../../kit/fonts/fonts.css">
<style>html,body{margin:0;background:#070707;overflow:hidden}canvas{display:block}</style>
</head><body>
<script src="../../kit/mark.js"></script>
<script src="../../kit/engine.js"></script>
<script src="../../kit/brand.js"></script>
<script src="../../kit/components.js"></script>
<script>
// Two people, two private AI chats: Bob and Alice copy-paste outputs across the gap
// until it strains, then the chats merge into one Channel with Rally and work flows.
stage({ w: 1080, h: 1080, outW: 1200, duration: 15 });

// the brief's cast (not the house cast); "AI" is a generic assistant, no logo
P.bob = { name: 'Bob', color: C.blue, ink: '#0b0c0a' };
P.alice = { name: 'Alice', color: C.orange, ink: '#0b0c0a' };
P.ai = { name: 'AI', color: '#5a5a5a', ink: '#fcfcfc' };

// ---------- timeline (seconds) ----------
const T = { strain0: 2.9, strain1: 5.2, meet: 5.22, fly: .5, stagger: .035, end: 11.4 };
const WB = { x: 44, y: 318, w: 482, h: 722 }, WA = { x: 554, y: 318, w: 482, h: 722 };
const APP = { x: 60, y: 318, w: 960, h: 722 };
const AI = (t, s) => ({ t, who: 'rally', by: 'AI', s, highlight: t => selected(msg => msg === ai[s], t) });
const ai = {}; // each AI answer by its text, so a drag can name what it copies
const say = (t, s) => (ai[s] = AI(t, s));
const pasted = (t, who, s) => ({ t, who, s: '“' + s + '”' });
const V1 = 'Plan v1: launch Tuesday, five steps.', V2 = 'Plan v2: launch Monday.', PRICE = '$49 a month. Launch Tuesday.';
const MSGS_B = [
  { t: -1, who: 'bob', s: 'Draft our launch plan' }, say(-1, V1),
  { t: 2.95, who: 'bob', s: 'Move launch to Monday.' }, say(3.2, V2),
  pasted(4.45, 'bob', PRICE), say(4.72, 'Tuesday? Your plan says Monday.'),
];
const MSGS_A = [
  { t: -1, who: 'alice', s: 'Can you price the launch?' }, say(-1, 'Which launch? I don’t have the plan.'),
  pasted(1.95, 'alice', V1), say(2.35, PRICE),
  pasted(3.95, 'alice', V2), say(4.27, 'Tuesday or Monday?'),
  { t: 4.98, who: 'alice', s: 'Wait, which version is this?' },
];
// copy-paste trips: each person reaches into the other's chat, selects that AI's answer
// and drags it back into their own; each trip faster than the last
const DRAGS = [
  { t: 1.35, dur: .6, from: 'B', copy: V1, pre: .6 },
  { t: 3.5, dur: .45, from: 'B', copy: V2 },
  { t: 4.05, dur: .4, from: 'A', copy: PRICE },
  { t: 4.52, dur: .32, from: 'B', copy: V2 },
  { t: 4.84, dur: .24, from: 'A', copy: PRICE },
  { t: 5.02, dur: .2, from: 'B', copy: V1 },
].map(d => ({ ...d, pre: d.pre || Math.min(.4, d.dur * .9) }));
// how selected an AI answer is: picked up just before the drag, let go as it lands
function selected(match, t) {
  let h = 0;
  DRAGS.forEach(d => { if (match(ai[d.copy])) h = Math.max(h, eo3(prog(t, d.t - d.pre * .6, d.t - d.pre * .2)) * (1 - prog(t, d.t + d.dur, d.t + d.dur + .3))); });
  return h;
}
// the merge: both chats' messages, in the order they were said, so Bob's and Alice's
// turns interleave; in the Channel both AIs' answers are Rally's
const SIDE = new Map([...MSGS_B.map(m => [m, 'B']), ...MSGS_A.map(m => [m, 'A'])]);
const MERGED = [...MSGS_B.map((m, i) => [m, i, 0]), ...MSGS_A.map((m, i) => [m, i, 1])]
  .sort((x, y) => x[0].t - y[0].t || x[1] - y[1] || x[2] - y[2]).map(([m]) => m);
const HISTORY = MERGED.map(m => ({ who: m.who, s: m.s, t: -1 }));
T.handoff = T.meet + T.fly + T.stagger * (MERGED.length - 1);
const MSGS = [...HISTORY,
  { t: 6.15, who: 'bob', s: 'Which plan is current?', mention: '@Rally' },
  { t: 6.6, who: 'rally', s: 'Plan v2: launch Monday at $49 a month.', stream: .45 },
  { t: 7.5, who: 'alice', s: 'Draft the launch post' },
  { t: 7.9, who: 'rally', s: 'Done. It matches the plan and pricing.', stream: .5, react: 8.9, reactors: [P.bob, P.alice] },
  { t: 9.4, who: 'bob', s: 'Monday it is.' },
  { t: 10.1, who: 'alice', s: 'Shipping it.' },
];
const CAPS = [
  { t0: -1, lines: [[['Same launch.', C.paper]], [['Two AI chats.', C.volt]]] },
  { t0: 2.6, lines: [[['Copy. Paste.', C.paper]], [['Re-explain.', C.volt]]] },
  { t0: 5.55, lines: [[['One chat.', C.paper]], [['Everyone’s in it.', C.volt]]] },
  { t0: 8.6, lines: [[['Less copying.', C.paper]], [['More shipping.', C.volt]]] },
];

// strain: 0 calm .. 1 at breaking point, just before the merge
const strain = t => eio3(prog(t, T.strain0, T.strain1)) * (1 - eio3(prog(t, T.meet - .12, T.meet)));
// each paste lands with a knock on the window it lands in
function knock(t, side) {
  let k = 0;
  DRAGS.forEach(d => { if ((d.from === 'B' ? 'A' : 'B') !== side) return; const x = t - d.t - d.dur; if (x > 0) k += Math.exp(-x * 14) * Math.sin(x * 70) * 9; });
  return k;
}
const OFF = { A: 0, B: 0 };
function src(d) { const w = d.from === 'B' ? WB : WA, m = ai[d.copy]; return [w.x + 170 + OFF[d.from], clamp(m._top ?? w.y + 470, w.y + 140, w.y + w.h - 160) + 66]; }
function dst(d) { const w = d.from === 'B' ? WA : WB; return [w.x + 200, w.y + w.h - 60]; }
function along(d, p) { p = prog(p, .2, 1); const a = src(d), b = dst(d), e = eio3(p); return [lerp(a[0], b[0], e), lerp(a[1], b[1], e) - Math.sin(Math.PI * p) * 170]; }

function aiWindow(ctx, t, w, side, who, msgs) {
  const s = strain(t), m = 0;
  const dir = side === 'B' ? -1 : 1, cx = w.x + w.w / 2, by = w.y + w.h;
  const jit = s * s * 4;
  ctx.save();
  OFF[side] = (W / 2 - cx) * m + knock(t, side) * dir + Math.sin(t * 53 + dir) * jit;
  ctx.translate(OFF[side], Math.cos(t * 47 + dir) * jit);
  ctx.translate(cx, by); ctx.rotate(dir * s * .045 * (1 - m)); ctx.translate(-cx, -by);
  const keep = CHAT.MAXW; CHAT.MAXW = 400;
  channelWindow(ctx, w, { title: P[who].name + '’s AI', sub: 'Only ' + P[who].name + ' can see this', people: [P[who], P.ai], hash: false, composer: 'Message AI' });
  chatStack(ctx, w, msgs, t);
  CHAT.MAXW = keep;
  ctx.restore();
}

// a clip of the AI's answer, pulled across by the receiver's cursor
function pasteCard(ctx, t, d) {
  const p = prog(t, d.t, d.t + d.dur); if (t < d.t || p >= 1) return;
  const [x, y] = along(d, p), sc = (.6 + .4 * eo3(prog(t, d.t, d.t + .1))) * (1 - .5 * eiX(prog(p, .75, 1)));
  const f = F.ui(500, 27), by = (d.from === 'B' ? 'Bob' : 'Alice') + '’s AI', w = Math.min(440, measure(ctx, d.copy, f)) + 44;
  let s = d.copy; while (measure(ctx, s, f) > 440) s = s.slice(0, -2) + '…';
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate((d.from === 'B' ? 1 : -1) * .06 * Math.sin(Math.PI * p));
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  rr(ctx, -22, -30, w, 96, 18); ctx.fillStyle = UI.raised; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.stroke();
  text(ctx, by, 0, 2, F.ui(500, 21), UI.muted);
  text(ctx, s, 0, 44, f, UI.text);
  ctx.restore();
}
function personCursor(ctx, t, side, who) {
  const w = side === 'B' ? WB : WA, rest = [w.x + w.w - 120, w.y + w.h - 175];
  let pos = [rest[0] + Math.sin(t * 2.1 + (side === 'B' ? 0 : 2)) * 9, rest[1] + Math.cos(t * 1.7) * 7], click = 0;
  DRAGS.filter(d => d.from !== side).forEach(d => { // the receiver does the dragging
    const back = Math.min(.3, d.dur * .8);
    if (t >= d.t - d.pre && t < d.t) pos = kf(t, [[d.t - d.pre, pos], [d.t - d.pre * .4, src(d), eo3], [d.t, src(d)]]);
    else if (t >= d.t && t < d.t + d.dur) pos = along(d, prog(t, d.t, d.t + d.dur));
    else if (t >= d.t + d.dur && t < d.t + d.dur + back) pos = kf(t, [[d.t + d.dur, dst(d)], [d.t + d.dur + back, pos, eo3]]);
    click = Math.max(click, Math.exp(-Math.abs(t - d.t) * 30), Math.exp(-Math.abs(t - d.t - d.dur) * 30));
  });
  const a = 1 - prog(t, T.meet, T.meet + .15);
  cursor(ctx, pos[0], pos[1], P[who], 1.5, a, click);
}

function apart(ctx, t) {
  if (t >= T.meet) return;
  aiWindow(ctx, t, WB, 'B', 'bob', MSGS_B);
  aiWindow(ctx, t, WA, 'A', 'alice', MSGS_A);
  DRAGS.forEach(d => pasteCard(ctx, t, d));
  personCursor(ctx, t, 'B', 'bob'); personCursor(ctx, t, 'A', 'alice');
}

// bottom-anchored tops for a finished list, the way chatStack lays it out
function tops(ctx, msgs, app, maxw) {
  const keep = CHAT.MAXW; CHAT.MAXW = maxw;
  let y = chatBottom(app); const out = new Map();
  for (let i = msgs.length - 1; i >= 0; i--) { y -= chatMsgHeight(ctx, msgs[i], 99); out.set(msgs[i], y); }
  CHAT.MAXW = keep; return out;
}
const lerpRect = (a, b, e) => ({ x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e), w: lerp(a.w, b.w, e), h: lerp(a.h, b.h, e) });

// the two windows slide into one, and every message flies to its slot in the Channel
function merging(ctx, t) {
  if (t < T.meet || t >= T.handoff) return;
  const e = eio5(prog(t, T.meet, T.meet + T.fly + .1)), old = 1 - prog(e, .45, .85);
  const keep = CHAT.MAXW; CHAT.MAXW = 400;
  if (old > 0) {
    ctx.save(); ctx.globalAlpha = old;
    channelWindow(ctx, lerpRect(WB, APP, e), { title: 'Bob’s AI', sub: 'Only Bob can see this', people: [P.bob, P.ai], hash: false, composer: 'Message AI' });
    channelWindow(ctx, lerpRect(WA, APP, e), { title: 'Alice’s AI', sub: 'Only Alice can see this', people: [P.alice, P.ai], hash: false, composer: 'Message AI' });
    ctx.restore();
  }
  CHAT.MAXW = keep;
  const shell = prog(e, .35, .85);
  if (shell > 0) {
    ctx.save(); ctx.globalAlpha = shell;
    channelWindow(ctx, lerpRect({ x: WB.x, y: WB.y, w: WA.x + WA.w - WB.x, h: WB.h }, APP, e), { title: 'launch', people: [P.bob, P.alice, P.rally] });
    ctx.restore();
  }
  const from = { B: tops(ctx, MSGS_B, WB, 400), A: tops(ctx, MSGS_A, WA, 400) }, to = tops(ctx, HISTORY, APP, CHAT.MAXW);
  ctx.save(); ctx.beginPath(); ctx.rect(0, APP.y + 106, W, chatBottom(APP) - APP.y - 98); ctx.clip();
  MERGED.forEach((m, i) => {
    const side = SIDE.get(m), w = side === 'B' ? WB : WA, h = HISTORY[i];
    const j = MERGED.length - 1 - i; // newest (the visible ones) lead
    const k = eio5(prog(t, T.meet + j * T.stagger, T.meet + T.fly + j * T.stagger));
    const top = lerp(from[side].get(m), to.get(h), k), r = lerpRect(w, APP, k);
    if (top < APP.y - 200) return;
    if (k < .5) { const kk = CHAT.MAXW; CHAT.MAXW = 400; chatMsg(ctx, r, m, top, t); CHAT.MAXW = kk; }
    else chatMsg(ctx, r, h, top, t);
  });
  ctx.restore();
}

function together(ctx, t) {
  if (t < T.handoff) return;
  const fall = eiX(prog(t, T.end - .15, T.end + .25)); if (fall >= 1) return;
  const push = 1 + .025 * prog(t, T.handoff, T.end);
  ctx.save(); ctx.globalAlpha = 1 - fall;
  ctx.translate(W / 2, APP.y + APP.h); ctx.scale(push, push); ctx.translate(-W / 2, -(APP.y + APP.h));
  channelWindow(ctx, APP, { title: 'launch', people: [P.bob, P.alice, P.rally] });
  chatStack(ctx, APP, MSGS, t);
  ctx.restore();
}

function end(ctx, lt) {
  endCard(ctx, lt, { cast: false });
  const homes = { bob: [230, 250], alice: [790, 270], rally: [W / 2 + 300, 950] };
  const starts = { bob: [-200, -100], alice: [W + 200, -150], rally: [W + 200, H + 170] };
  Object.keys(homes).forEach((n, i) => {
    const p = eo5(prog(lt, .7 + i * .07, 1.3 + i * .07)); if (p <= 0) return;
    cursor(ctx, lerp(starts[n][0], homes[n][0], p) + Math.sin(lt * 2.3 + i) * 6 * p, lerp(starts[n][1], homes[n][1], p) + Math.cos(lt * 1.9 + i * 2) * 5 * p, P[n], 1.35, 1);
  });
}

start((ctx, t) => {
  if (t >= T.end) { end(ctx, t - T.end); return; }
  glow(ctx, W * .8, H * .1, 900, C.volt, .06 * prog(t, T.meet + .2, T.handoff));
  captions(ctx, t, CAPS, { end: T.end });
  apart(ctx, t);
  merging(ctx, t);
  together(ctx, t);
  brandBug(ctx, 1 - prog(t, T.end - .1, T.end + .15));
});
</script>
</body></html>
