<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>:root{--avalon-mark-src:url("../../assets/brand/avalon-mark.png")}html,body{margin:0}body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:16px}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}.col{display:grid;gap:8px}.lbl{color:var(--muted-2);font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.AvalonDesignSystem_5d1c5e;
const MARK = "../../assets/brand/avalon-mark.png";

const { TextField, SearchField, SelectField, ToggleSwitch, OptionCard, Icon } = NS;
function Demo() {
  const [region, setRegion] = React.useState('eu');
  const [watched, setWatched] = React.useState(true);
  return (
    <div style={{ display: 'grid', gap: 18, gridTemplateColumns: '1fr 1fr' }}>
      <div className="col" style={{ gap: 14 }}>
        <TextField label="Organization name" placeholder="Acme" prefix={<Icon name="building-2" size={15} />} />
        <div className="col"><span className="lbl">Search · select · toggle</span>
          <SearchField placeholder="Search settings" />
          <div className="row">
            <SelectField ariaLabel="Model" options={[{ value: 'grok', label: 'x-ai/grok-4.3' }, { value: 'flash', label: 'gemini-2.5-flash-lite' }]} value="grok" />
            <ToggleSwitch checked={watched} label="Watch for changes" onChange={() => setWatched(!watched)} />
          </div>
        </div>
      </div>
      <div className="col"><span className="lbl">Option cards</span>
        <OptionCard description="Data stays in the Global region" icon={<Icon name="globe" size={16} />} onSelect={() => setRegion('global')} selected={region === 'global'} title="Global" />
        <OptionCard description="Data stays in the European Union" icon={<Icon name="globe-lock" size={16} />} onSelect={() => setRegion('eu')} selected={region === 'eu'} title="European Union" />
        <OptionCard description="Focus on existing enterprise buyers" shortcut="1" title="Enterprise buyers" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
