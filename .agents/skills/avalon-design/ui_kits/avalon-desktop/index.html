<!-- @startingPoint section="Avalon desktop" subtitle="Full Electron workspace: sidebar, transcript, composer, rail" viewport="1280x820" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Avalon — workspace</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{height:100%;margin:0;overflow:hidden}body{background:var(--canvas)}#root{height:100%}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./ContextRail.jsx"></script>
<script type="text/babel" src="./Screens.jsx"></script>
<script type="text/babel">
const MARK = '../../assets/brand/avalon-mark.png';
function App() {
  const data = window.AvalonData;
  const [route, setRoute] = React.useState({ name: 'workstream', id: 'launch' });
  const [railOpen, setRailOpen] = React.useState(true);
  const workstream = data.workstreams.find((item) => item.id === route.id) || data.workstreams[0];
  const showRail = railOpen && route.name === 'workstream';
  return (
    <div style={{ background: 'var(--surface)', height: '100%', overflow: 'hidden', position: 'relative', width: '100%' }}>
      <Sidebar data={data} markSrc={MARK} onRoute={setRoute} route={route} />
      <main style={{ height: '100%', marginLeft: 300, overflow: 'hidden', paddingRight: showRail ? 348 : 0, position: 'relative', transition: 'padding-right 160ms ease' }}>
        {route.name === 'workstream' && <WorkstreamScreen data={data} markSrc={MARK} onToggleRail={() => setRailOpen(!railOpen)} railOpen={railOpen} workstream={workstream} />}
        {route.name === 'home' && <HomeScreen data={data} markSrc={MARK} onOpen={(id) => setRoute({ name: 'workstream', id })} />}
        {route.name === 'automations' && <AutomationsScreen data={data} />}
        {route.name === 'settings' && <SettingsScreen data={data} />}
      </main>
      {showRail && <ContextRail data={data} onClose={() => setRailOpen(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
