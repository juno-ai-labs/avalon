<!-- @dsCard group="Colors" viewport="700x130" name="Site surfaces" subtitle="Marketing pages sit on a deeper black (.avalon-site scope)" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#070807;color:#f0efe8"><span class="n">--canvas-deep</span><span class="v">#070807</span></div><div class="sw" style="background:#0b0d0b;color:#f0efe8"><span class="n">--canvas</span><span class="v">#0b0d0b</span></div><div class="sw" style="background:#141613;color:#f0efe8"><span class="n">--surface</span><span class="v">#141613</span></div><div class="sw" style="background:#1a1c18;color:#f0efe8"><span class="n">--surface-2</span><span class="v">#1a1c18</span></div><div class="sw" style="background:#22241f;color:#f0efe8"><span class="n">--surface-3</span><span class="v">#22241f</span></div></div></body></html>
