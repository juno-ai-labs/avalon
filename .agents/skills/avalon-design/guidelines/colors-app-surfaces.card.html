<!-- @dsCard group="Colors" viewport="700x130" name="Workspace surfaces" subtitle="Desktop app greens-in-the-black, canvas up to raised" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)">
<div class="sw" style="background:#111210;color:#ecebe5"><span class="n">--canvas</span><span class="v">#111210</span></div><div class="sw" style="background:#181916;color:#ecebe5"><span class="n">--sidebar</span><span class="v">#181916</span></div><div class="sw" style="background:#1d1e1b;color:#ecebe5"><span class="n">--surface</span><span class="v">#1d1e1b</span></div><div class="sw" style="background:#22231f;color:#ecebe5"><span class="n">--surface-2</span><span class="v">#22231f</span></div><div class="sw" style="background:#292a26;color:#ecebe5"><span class="n">--raised</span><span class="v">#292a26</span></div><div class="sw" style="background:#30312c;color:#ecebe5"><span class="n">--raised-hover</span><span class="v">#30312c</span></div></div></body></html>
