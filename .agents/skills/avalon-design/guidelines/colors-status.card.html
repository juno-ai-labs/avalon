<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Run states: running, needs input, completed, failed" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#47c7fc;color:#111210"><span class="n">--status-blue</span><span class="v">#47c7fc</span></div><div class="sw" style="background:#e6bd45;color:#111210"><span class="n">--status-yellow</span><span class="v">#e6bd45</span></div><div class="sw" style="background:#6ecb87;color:#111210"><span class="n">--status-green</span><span class="v">#6ecb87</span></div><div class="sw" style="background:#d8756f;color:#111210"><span class="n">--status-red</span><span class="v">#d8756f</span></div><div class="sw" style="background:#77766f;color:#ecebe5"><span class="n">--status-completed</span><span class="v">#77766f</span></div></div></body></html>
