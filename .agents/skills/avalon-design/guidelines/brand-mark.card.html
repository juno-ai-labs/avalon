<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="row" style="gap:26px">
<span style="background:var(--brand-primary);display:inline-block;height:64px;width:64px;-webkit-mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat;mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat"></span>
<span style="background:var(--ink);display:inline-block;height:40px;width:40px;-webkit-mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat;mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat"></span>

<span style="align-items:center;background:#ecebe5;border-radius:14px;display:inline-flex;height:64px;justify-content:center;width:64px"><span style="background:#111210;display:inline-block;height:52px;width:52px;-webkit-mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat;mask:url('../assets/brand/avalon-mark.png') center/contain no-repeat"></span></span></div></body></html>
