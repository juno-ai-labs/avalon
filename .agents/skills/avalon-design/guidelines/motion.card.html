<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="Opacity pulses and 140ms colour fades. Nothing bounces." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="row" style="gap:22px">
<span style="align-items:center;color:var(--muted);display:flex;font-size:11px;gap:6px"><i style="animation:avalon-active-pulse 1.4s ease-in-out infinite;background:var(--brand-secondary);border-radius:999px;display:inline-block;height:7px;width:7px"></i>running · opacity pulse 1.4s</span>
<span style="align-items:center;color:var(--muted);display:flex;font-size:11px;gap:6px"><i style="animation:avalon-spin .8s linear infinite;border:2px solid #45463f;border-radius:999px;border-top-color:var(--ink-soft);display:inline-block;height:16px;width:16px"></i>spinner · 0.8s linear</span>
<span style="animation:avalon-skeleton-pulse 1.5s ease-in-out infinite;background:#22231f;border-radius:7px;display:inline-block;height:40px;width:150px"></span></div>
<p class="v" style="margin-top:14px">140ms hover · 180ms site hover · 220ms panel · 650ms cubic-bezier(.2,.7,.2,1) scroll reveal</p></body></html>
