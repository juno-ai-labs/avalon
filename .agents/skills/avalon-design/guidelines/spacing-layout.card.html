<!-- @dsCard group="Spacing" viewport="700x180" name="Layout constants" subtitle="Fixed widths the product never deviates from" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div style="border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:150px minmax(0,1fr) 160px;height:130px;overflow:hidden">
<div style="background:var(--sidebar);border-right:1px solid var(--line-soft);display:grid;place-items:center"><span class="v">sidebar 300px</span></div>
<div style="background:var(--surface);display:grid;place-items:center"><span class="v">transcript column max 860px</span></div>
<div style="background:#20211e;border-left:1px solid var(--line-soft);display:grid;place-items:center"><span class="v">rail 320–380px</span></div></div></body></html>
