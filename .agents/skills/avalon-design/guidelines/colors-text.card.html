<!-- @dsCard group="Colors" viewport="700x150" name="Text & lines" subtitle="Four ink levels and two hairlines" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="grid" style="gap:6px">
<div style="color:var(--ink);font-size:14px">--ink · #ecebe5 · titles, active rows, agent output</div>
<div style="color:var(--ink-soft);font-size:13px">--ink-soft · #cac9c2 · body and secondary labels</div>
<div style="color:var(--muted);font-size:12px">--muted · #94948c · metadata, hints, placeholders</div>
<div style="color:var(--muted-2);font-size:11px">--muted-2 · #706f69 · timestamps, disabled, micro copy</div>
<div style="border-top:1px solid var(--line);color:var(--muted-2);font-size:10px;margin-top:6px;padding-top:6px">--line · #32332e</div>
<div style="border-top:1px solid var(--line-soft);color:var(--muted-2);font-size:10px;padding-top:6px">--line-soft · #292a26</div></div></body></html>
