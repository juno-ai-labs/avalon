<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#cedc00;color:#111210"><span class="n">--brand-primary</span><span class="v">#cedc00</span></div><div class="sw" style="background:#e0ec25;color:#111210"><span class="n">--brand-primary-hover</span><span class="v">#e0ec25</span></div><div class="sw" style="background:#47c7fc;color:#111210"><span class="n">--brand-secondary</span><span class="v">#47c7fc</span></div><div class="sw" style="background:#ff6337;color:#0b0d0b"><span class="n">--brand-warm</span><span class="v">#ff6337</span></div></div></body></html>
