          # A fork PR receives no secrets at all, so name that case: otherwise
          # this sends the reader to check a setting that is already correct.
          if [ -z "$AZURE_API_KEY" ]; then
            echo "::error::The AZURE_AI_API_KEY repo secret is not set (or this is a fork PR, which does not receive repo secrets)."
            exit 1
          fi
          if [ -z "$AZURE_AI_API_ENDPOINT" ]; then
            echo "::error::The AZURE_AI_API_ENDPOINT repo variable is not set."
            exit 1
          fi

          # Trim whitespace a copy-paste into the variable field can leave behind.
          endpoint="$AZURE_AI_API_ENDPOINT"
