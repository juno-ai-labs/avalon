      # which ask GraphQL for the head commit's check-status rollup — including
      # each check's Actions workflow, so the query reaches
      # `checkSuite -> workflowRun`, an Actions resource. An explicit
      # `permissions:` block sets every scope it does NOT list to `none`, so
      # missing any one of them fails the whole command with "GraphQL: Resource
      # not accessible by integration". Granting only `checks`/`statuses` was
      # tried first and was not enough. All three are read-only. See
      # https://github.com/orgs/community/discussions/67181 and
      # https://docs.github.com/en/graphql/reference/actions.
      #
      # The failure is silent — `gh pr diff` still works, so the reviewer posts a
      # normal-looking review built from the diff with no PR title or
      # description. The prompt's `--json` fallback exists to make the next
      # occurrence visible in the review itself.
      checks: read
      statuses: read
      actions: read
