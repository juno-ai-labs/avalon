name: Deploy Avalon API

# Ordinary regional release, in the order docs/runbook.md requires:
# build and locally profile all seven static Worker artifacts, upload every
# ordinary Worker version without traffic, apply ordinary remote D1 migrations,
# promote EU services and API, prove EU health, promote Global, then prove both regions. The one
# destructive product-schema retirement is detected from each region's pending
# ledger and applied after that region has the compatible replacement Worker.
#
# The Global Worker holds named service bindings into EU entrypoints, so EU is
# always deployed first. A release that introduces a brand-new cross-region
# entrypoint is the documented three-stage bootstrap exception and must be run
# by hand — never deploy a caller before its target entrypoint exists.
#
# Prerequisites this workflow does not perform (one-time, per the runbook):
# unrelated regional resource creation, confirming each configured D1 ID belongs
# to its intended region, and setting the regional Worker secrets. The
# preflights below do create every declared Queue and both complete Global
# lakehouses with generated Pipeline bindings. EU inference and analytics-events
# lakehouse exports are intentionally absent.
#
# Merging to main deploys both regions and applies pending migrations without a
# human in the loop. The api-production environment exists to scope the
# Cloudflare token to this job, not to gate it: adding required reviewers to
# that environment would turn every merge into a queued approval.

on:
  push:
    branches:
      - main
    paths:
      # Everything the Worker bundle or its schema is built from. A merge that
      # touches only docs, the desktop app, or the site does not redeploy.
      - "apps/api/**"
      - "apps/engineering-mcp/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"
      # The scripts the deploy job itself runs: the two preflights, the module
      # they share, and the health check. A change to any of them is a change
      # to the deployment, and a redeploy is idempotent.
      - "scripts/check-cloudflare-r2-buckets.mjs"
      - "scripts/ensure-cloudflare-queues.mjs"
      - "scripts/ensure-cloudflare-inference-lakehouse.mjs"
      - "config/inference-lakehouse.json"
      - "config/inference-lakehouse-stream-schema.json"
      - "config/analytics-events-lakehouse.json"
      - "config/analytics-events-lakehouse-stream-schema.json"
      - "scripts/wrangler-config.mjs"
      - "scripts/entry-point.mjs"
      - "scripts/check-regional-health.mjs"
      - "scripts/check-workspace-handoff-site.mjs"
      - "scripts/select-api-deploy-mode.mjs"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy (defaults to the caller's ref)
        required: false
        type: string
      regions:
        description: Regions to deploy; EU always precedes Global
        required: true
        default: eu-and-global
        type: choice
        options:
          - eu-and-global
          - eu
          - global
      apply_migrations:
        description: Apply pending D1 migrations remotely before deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Deployments never overlap: GitHub holds at most one pending run per group, so
# a burst of merges collapses to "the newest commit deploys" and the superseded
# pending runs are dropped. cancel-in-progress stays false so a run that is
# already applying migrations is never killed halfway through.
concurrency:
  group: deploy-api
  cancel-in-progress: false
  queue: single

jobs:
  # ci.yml runs on the same push, but as a separate workflow it cannot gate
  # this one: both start together, so migrations could apply before CI finishes
  # or after it has already failed. Verifying here makes the deployment
  # self-gating rather than dependent on a race.
  # The lanes mirror ci.yml's, deliberately: the same split is already balanced
  # against this repository's suites, and two workflows that verify the same
  # revision differently is a way to have one of them pass on something the
  # other would have caught. Workers in particular must stay on their own two
  # shards (`api-tests-workers-1-of-n` / `2-of-n`) rather than being dumped
  # unsharded onto a Node lane: `reset()` takes every object's input gate
  # run-wide, and an unsharded full-suite Miniflare is more interleave than PR
  # CI ever sees. The Wrangler dry-run builds live here rather than in `deploy`
  # because they validate the revision, not the deployment — and a
  # config error should fail beside lint, minutes earlier, instead of after the
  # deploy job has re-installed dependencies.
  checks:
    name: verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: pnpm lint
          - name: typecheck-and-build-invariants
            command: >-
              pnpm typecheck &&
              pnpm --filter @rally/api build &&
              pnpm --filter @rally/api build:eu &&
              pnpm --filter @rally/api build:documents &&
              pnpm --filter @rally/api build:documents:eu &&
              pnpm --filter @rally/api build:terminal &&
              pnpm --filter @rally/api build:terminal:eu &&
              pnpm --filter @rally/api build:pricing &&
              pnpm --filter @rally/engineering-mcp build &&
              pnpm --filter @rally/desktop test:release
          - name: desktop-tests-1-of-2
            command: pnpm --filter @rally/desktop exec vitest run --shard=1/2
          - name: desktop-tests-2-of-2
            command: pnpm --filter @rally/desktop exec vitest run --shard=2/2
          - name: api-tests-1-of-2
            command: pnpm --filter @rally/api exec vitest run --shard=1/2
          - name: api-tests-2-of-2
            command: pnpm --filter @rally/api exec vitest run --shard=2/2
          - name: api-tests-workers-1-of-n
            command: pnpm --filter @rally/api exec vitest run --config vitest.workers.config.ts --shard=1/2
          - name: api-tests-workers-2-of-n
            command: pnpm --filter @rally/api exec vitest run --config vitest.workers.config.ts --shard=2/2
          - name: crash-symbolicator-container
            command: pnpm --filter @rally/api test:crash-symbolicator-container
          - name: remaining-tests
            command: >-
              pnpm --filter '!@rally/desktop' --filter '!@rally/api' --recursive --if-present test &&
              pnpm test:scripts
    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The symbolicator image compiles `minidump-stackwalk` from source, which
      # costs about three and a half minutes and depends on nothing in this
      # repository. `install: true` points the plain `docker build` the lane's
      # own script runs at this cache-capable `docker-container` builder, so the
      # warm-up below and that build share one BuildKit cache.
      - name: Use a cache-capable container builder
        if: matrix.name == 'crash-symbolicator-container'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # This step is the only thing that touches the shared cache: it imports
      # the compiled layer, rebuilds it when the Dockerfile has moved, and
      # exports it again. The build that follows names no cache and resolves
      # every layer from the builder's now-warm local cache.
      #
      # `load: true` is what makes that possible, and it is not incidental. A
      # remote cache import is lazy: it resolves cache keys without fetching the
      # layers behind them, and BuildKit keeps that only for the solve it was
      # imported for. A `type=cacheonly` warm-up therefore left nothing a later,
      # separate `docker build` could reuse — it reported every vertex CACHED in
      # 2.4s and the lane then recompiled the crate from scratch anyway.
      # Materializing the image forces the layers down and into the builder's
      # local cache, which is the state the next build actually hits. The tag is
      # a side effect; nothing consumes it.
      #
      # It has to be an action rather than a `docker buildx build` line. The
      # `type=gha` backend authenticates with `ACTIONS_RUNTIME_TOKEN`, which the
      # runner injects into JavaScript actions and never into a `run:` step, so
      # driving the cache from the lane's script imported and exported nothing.
      - name: Warm the symbolicator image cache
        if: matrix.name == 'crash-symbolicator-container'
        uses: docker/build-push-action@v6
        with:
          context: apps/api/crash-symbolicator
          platforms: linux/amd64
          load: true
          tags: avalon-crash-symbolicator:warm
          cache-from: type=gha,scope=crash-symbolicator
          cache-to: type=gha,mode=max,scope=crash-symbolicator

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Preserve Worker startup evidence
        if: ${{ always() && matrix.name == 'typecheck-and-build-invariants' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-worker-startup-profiles-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            apps/api/dist/startup.cpuprofile
            apps/api/dist-eu/startup.cpuprofile
            apps/api/dist-documents/startup.cpuprofile
            apps/api/dist-documents-eu/startup.cpuprofile
            apps/api/dist-terminal/startup.cpuprofile
            apps/api/dist-terminal-eu/startup.cpuprofile
            apps/api/dist-pricing/startup.cpuprofile

  # `deploy` gates on this one job rather than on the matrix, so the lane list
  # can change without touching the deployment. `always()` makes it report a
  # failure rather than being skipped when a lane fails or is cancelled — a
  # skipped gate would let `deploy` run behind a red verification.
  verify:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Require every verification lane to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the verified revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: api-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A push carries no inputs, so it takes the full both-regions path.
      DEPLOY_EU: ${{ github.event_name != 'workflow_dispatch' || inputs.regions != 'global' }}
      DEPLOY_GLOBAL: ${{ github.event_name != 'workflow_dispatch' || inputs.regions != 'eu' }}
      APPLY_MIGRATIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_migrations }}

    steps:
      # The dispatch input may name a mutable branch, so deploy the immutable
      # commit that verify resolved rather than resolving the input again.
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
          # Deployment-mode selection compares the active tagged production
          # revision with this exact commit.
          fetch-depth: 0

      - name: Require Cloudflare deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The public site and API deploy from independent workflows. A writer
      # release must not emit /app/workspaces links until Pages serves that
      # rewrite and the live updater advertises a desktop that understands its
      # native target. If either independent release is pending or failed, this
      # run stops before migrations or Worker upload and can be re-run later.
      - name: Require workspace-addressed link readers
        run: node scripts/check-workspace-handoff-site.mjs

      # All preflights run on the pinned Node but before any third-party code
      # is installed: they import nothing outside this repository, and they are
      # the first use of the production token in this job.
      - name: Require every R2 bucket declared by the regional Wrangler configs
        run: node scripts/check-cloudflare-r2-buckets.mjs

      # Wrangler applies a consumer's settings but will not create the queue a
      # binding names, so a release that adds a queue would fail halfway through.
      # Read every Wrangler file and create whatever is missing first; nothing
      # about a queue is a manual step. The tracker deployment runs the same
      # script and declares the same report queue, so the two can race on one
      # create; the loser re-lists and passes if the queue exists.
      - name: Ensure every Queue the Wrangler configs declare exists
        run: node scripts/ensure-cloudflare-queues.mjs

      # Stream IDs are generated by Cloudflare and a Worker Pipeline binding
      # requires that ID. This one idempotent preflight creates the Global
      # buckets/catalogs/streams/sinks/pipelines, verifies immutable resources,
      # and writes ignored Wrangler configs. EU's generated config intentionally
      # has no lakehouse bindings. A first merge therefore takes the same path
      # as every later merge.
      - name: Ensure the Global lakehouses and materialize bindings
        run: node scripts/ensure-cloudflare-inference-lakehouse.mjs --materialize-bindings

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Every service uses a static dependency graph. Build the internal
      # services first, then the materialized regional API configs that bind to
      # them. The same Wrangler configs are uploaded below.
      - name: Build and profile the EU document-processing Worker
        if: env.DEPLOY_EU == 'true'
        run: pnpm --filter @rally/api build:documents:eu

      - name: Build and profile the EU Terminal-provider Worker
        if: env.DEPLOY_EU == 'true'
        run: pnpm --filter @rally/api build:terminal:eu

      - name: Build and profile the exact EU Worker artifact
        if: env.DEPLOY_EU == 'true'
        run: pnpm --filter @rally/api build:deployed:eu

      - name: Build and profile the Global document-processing Worker
        if: env.DEPLOY_GLOBAL == 'true'
        run: pnpm --filter @rally/api build:documents

      - name: Build and profile the Global Terminal-provider Worker
        if: env.DEPLOY_GLOBAL == 'true'
        run: pnpm --filter @rally/api build:terminal

      - name: Build and profile the Global inference-pricing Worker
        if: env.DEPLOY_GLOBAL == 'true'
        run: pnpm --filter @rally/api build:pricing

      - name: Build and profile the exact Global Worker artifact
        if: env.DEPLOY_GLOBAL == 'true'
        run: pnpm --filter @rally/api build:deployed

      # Ordinary code releases use Cloudflare Versions: both selected regions
      # are authoritatively uploaded before either receives traffic. A release
      # that changes a Wrangler config (including DO migrations) or the
      # container image must use direct deploy because Versions cannot apply
      # that platform state. Active version tags make the choice reproducible;
      # an untagged or divergent baseline fails safe to direct deployment.
      - name: Select the Cloudflare deployment mode
        id: deploy_mode
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          deployed_sha() {
            local config="$1"
            local deployment version_id versions tag
            if ! deployment="$(pnpm --filter @rally/api exec wrangler deployments status --config "$config" --json 2>/dev/null)"; then
              echo unknown
              return
            fi
            version_id="$(jq -r 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else empty end' <<< "$deployment")"
            if [ -z "$version_id" ]; then
              echo unknown
              return
            fi
            if ! versions="$(pnpm --filter @rally/api exec wrangler versions list --config "$config" --json 2>/dev/null)"; then
              echo unknown
              return
            fi
            tag="$(jq -r --arg version_id "$version_id" \
              '[.[] | select(.id == $version_id) | .annotations["workers/tag"]][0] // "unknown"' \
              <<< "$versions")"
            echo "$tag"
          }

          args=()
          if [ "$DEPLOY_EU" = "true" ]; then
            args+=(--deployed-sha "$(deployed_sha wrangler.documents.eu.jsonc)")
            args+=(--deployed-sha "$(deployed_sha wrangler.terminal.eu.jsonc)")
            args+=(--deployed-sha "$(deployed_sha .wrangler.lakehouses.eu.json)")
          fi
          if [ "$DEPLOY_GLOBAL" = "true" ]; then
            args+=(--deployed-sha "$(deployed_sha wrangler.documents.global.jsonc)")
            args+=(--deployed-sha "$(deployed_sha wrangler.terminal.global.jsonc)")
            args+=(--deployed-sha "$(deployed_sha wrangler.pricing.global.jsonc)")
            args+=(--deployed-sha "$(deployed_sha .wrangler.lakehouses.global.json)")
          fi
          selection="$(node scripts/select-api-deploy-mode.mjs "${args[@]}")"
          echo "mode=$(jq -r .mode <<< "$selection")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r .reason <<< "$selection")" >> "$GITHUB_OUTPUT"
          echo "$selection"

      - name: Upload all EU Worker versions without traffic
        id: upload_eu
        if: env.DEPLOY_EU == 'true' && steps.deploy_mode.outputs.mode == 'versioned'
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          upload_version() {
            local config="$1"
            local output_name="$2"
            local output_file="${RUNNER_TEMP}/wrangler-${output_name}-${GITHUB_RUN_ATTEMPT}.json"
            WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            pnpm --filter @rally/api exec wrangler versions upload \
              --config "$config" \
              --tag "$DEPLOY_SHA" \
              --message "Verified GitHub deployment $DEPLOY_SHA"
            local version_id
            version_id="$(jq -r 'select(.type == "version-upload") | .version_id' "$output_file" | tail -n 1)"
            test -n "$version_id" && test "$version_id" != null
            echo "${output_name}=${version_id}" >> "$GITHUB_OUTPUT"
          }
          upload_version wrangler.documents.eu.jsonc eu_documents
          upload_version wrangler.terminal.eu.jsonc eu_terminal
          upload_version .wrangler.lakehouses.eu.json eu_api

      - name: Upload all Global Worker versions without traffic
        id: upload_global
        if: env.DEPLOY_GLOBAL == 'true' && steps.deploy_mode.outputs.mode == 'versioned'
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          upload_version() {
            local config="$1"
            local output_name="$2"
            local output_file="${RUNNER_TEMP}/wrangler-${output_name}-${GITHUB_RUN_ATTEMPT}.json"
            WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            pnpm --filter @rally/api exec wrangler versions upload \
              --config "$config" \
              --tag "$DEPLOY_SHA" \
              --message "Verified GitHub deployment $DEPLOY_SHA"
            local version_id
            version_id="$(jq -r 'select(.type == "version-upload") | .version_id' "$output_file" | tail -n 1)"
            test -n "$version_id" && test "$version_id" != null
            echo "${output_name}=${version_id}" >> "$GITHUB_OUTPUT"
          }
          upload_version wrangler.documents.global.jsonc global_documents
          upload_version wrangler.terminal.global.jsonc global_terminal
          upload_version wrangler.pricing.global.jsonc global_pricing
          upload_version .wrangler.lakehouses.global.json global_api

      - name: List the pending remote migrations for EU
        id: pending_eu
        if: env.DEPLOY_EU == 'true'
        run: |
          set -euo pipefail
          pending="$(pnpm --filter @rally/api db:migrate:remote:list:eu)"
          echo "$pending"
          classification="$(node scripts/classify-pending-d1-migrations.mjs \
            0090_drop_legacy_product_tables.sql \
            0094_retire_agent_inference_payload_ledger.sql \
            0097_email_routes_use_full_address.sql <<< "$pending")"
          echo "$classification" >> "$GITHUB_OUTPUT"

      - name: List the pending remote migrations for Global
        id: pending_global
        if: env.DEPLOY_GLOBAL == 'true'
        run: |
          set -euo pipefail
          pending="$(pnpm --filter @rally/api db:migrate:remote:list)"
          echo "$pending"
          classification="$(node scripts/classify-pending-d1-migrations.mjs \
            0090_drop_legacy_product_tables.sql \
            0094_retire_agent_inference_payload_ledger.sql \
            0097_email_routes_use_full_address.sql <<< "$pending")"
          echo "$classification" >> "$GITHUB_OUTPUT"

      - name: Apply the remote D1 migrations to EU
        if: >-
          env.APPLY_MIGRATIONS == 'true' && env.DEPLOY_EU == 'true' &&
          steps.pending_eu.outputs.worker_first != 'true'
        run: pnpm --filter @rally/api db:migrate:remote:eu

      - name: Apply the remote D1 migrations to Global
        if: >-
          env.APPLY_MIGRATIONS == 'true' && env.DEPLOY_GLOBAL == 'true' &&
          steps.pending_global.outputs.worker_first != 'true'
        run: pnpm --filter @rally/api db:migrate:remote

      # Both regional deployments build the symbolicator image, and Wrangler
      # drives that build itself with a fixed `docker build` line that takes no
      # cache flags — so this job recompiled `minidump-stackwalk` from source,
      # about three and a half minutes, on every release. It cannot be handed a
      # cache, but it can be handed a warm builder: `install: true` points its
      # `docker build` at the same `docker-container` builder the step below
      # fills from the layers `checks` exported earlier in this run. Wrangler
      # already passes `--load`, so its image still reaches the daemon's image
      # store to be tagged and pushed.
      #
      # Nothing is exported here. The `crash-symbolicator-container` lane owns
      # that scope, and it has always run before this job.
      - name: Use a cache-capable container builder
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # `load: true` rather than a cache-only warm-up: a remote cache import is
      # lazy and scoped to its own solve, so materializing the image is what
      # puts the layers in the builder's local cache where Wrangler's separate
      # `docker build` can reuse them.
      - name: Warm the symbolicator image cache
        uses: docker/build-push-action@v6
        with:
          context: apps/api/crash-symbolicator
          platforms: linux/amd64
          load: true
          tags: avalon-crash-symbolicator:warm
          cache-from: type=gha,scope=crash-symbolicator

      # EU precedes Global because Global binds named EU entrypoints.
      - name: Deploy the EU Worker
        if: env.DEPLOY_EU == 'true'
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy_mode.outputs.mode }}" = "versioned" ]; then
            promote_version() {
              local config="$1"
              local version_id="$2"
              pnpm --filter @rally/api exec wrangler versions deploy \
                --config "$config" \
                --version-id "$version_id" \
                --percentage 100 \
                --message "Promote verified GitHub deployment $DEPLOY_SHA" \
                --yes
            }
            promote_version wrangler.documents.eu.jsonc "${{ steps.upload_eu.outputs.eu_documents }}"
            promote_version wrangler.terminal.eu.jsonc "${{ steps.upload_eu.outputs.eu_terminal }}"
            promote_version .wrangler.lakehouses.eu.json "${{ steps.upload_eu.outputs.eu_api }}"
          else
            for config in wrangler.documents.eu.jsonc wrangler.terminal.eu.jsonc .wrangler.lakehouses.eu.json; do
              pnpm --filter @rally/api exec wrangler deploy \
                --config "$config" \
                --tag "$DEPLOY_SHA" \
                --message "Verified GitHub deployment $DEPLOY_SHA"
            done
          fi

      - name: Verify EU health before Global promotion
        if: env.DEPLOY_EU == 'true'
        run: node scripts/check-regional-health.mjs eu

      - name: Deploy the Global Worker
        if: env.DEPLOY_GLOBAL == 'true'
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy_mode.outputs.mode }}" = "versioned" ]; then
            promote_version() {
              local config="$1"
              local version_id="$2"
              pnpm --filter @rally/api exec wrangler versions deploy \
                --config "$config" \
                --version-id "$version_id" \
                --percentage 100 \
                --message "Promote verified GitHub deployment $DEPLOY_SHA" \
                --yes
            }
            promote_version wrangler.documents.global.jsonc "${{ steps.upload_global.outputs.global_documents }}"
            promote_version wrangler.terminal.global.jsonc "${{ steps.upload_global.outputs.global_terminal }}"
            promote_version wrangler.pricing.global.jsonc "${{ steps.upload_global.outputs.global_pricing }}"
            promote_version .wrangler.lakehouses.global.json "${{ steps.upload_global.outputs.global_api }}"
          else
            for config in wrangler.documents.global.jsonc wrangler.terminal.global.jsonc wrangler.pricing.global.jsonc .wrangler.lakehouses.global.json; do
              pnpm --filter @rally/api exec wrangler deploy \
                --config "$config" \
                --tag "$DEPLOY_SHA" \
                --message "Verified GitHub deployment $DEPLOY_SHA"
            done
          fi

      - name: Verify Global health before schema retirement
        if: env.DEPLOY_GLOBAL == 'true'
        run: node scripts/check-regional-health.mjs global

      # Worker-first migrations delete columns or tables the previous Worker
      # still names. The pending remote ledger, rather than the triggering diff,
      # controls this ordering so a superseded workflow or manual regional run
      # cannot skip the compatibility barrier.
      - name: Apply Worker-first D1 migrations in EU after the compatible Worker
        if: >-
          env.APPLY_MIGRATIONS == 'true' && env.DEPLOY_EU == 'true' &&
          steps.pending_eu.outputs.worker_first == 'true'
        run: pnpm --filter @rally/api db:migrate:remote:eu

      - name: Apply Worker-first D1 migrations in Global after the compatible Worker
        if: >-
          env.APPLY_MIGRATIONS == 'true' && env.DEPLOY_GLOBAL == 'true' &&
          steps.pending_global.outputs.worker_first == 'true'
        run: pnpm --filter @rally/api db:migrate:remote

      - name: Verify regional health
        run: |
          set -euo pipefail
          regions=""
          if [ "$DEPLOY_EU" = "true" ]; then regions="$regions eu"; fi
          if [ "$DEPLOY_GLOBAL" = "true" ]; then regions="$regions global"; fi
          node scripts/check-regional-health.mjs $regions

      # The MCP binds both regional API entrypoints. It is deliberately last:
      # a first release cannot make its caller live until both named targets
      # exist, and a partial manual regional deployment must leave the current
      # MCP deployment untouched.
      - name: Deploy the engineering MCP after both regional entrypoints
        if: env.DEPLOY_EU == 'true' && env.DEPLOY_GLOBAL == 'true'
        run: pnpm --filter @rally/engineering-mcp run deploy

      - name: Verify the engineering MCP advertises OAuth to non-browser clients
        if: env.DEPLOY_EU == 'true' && env.DEPLOY_GLOBAL == 'true'
        run: |
          set -euo pipefail
          # Reuse the existing Access propagation window from deploy-ace.yml;
          # this is the same custom-domain and Access control-plane operation.
          for attempt in 1 2 3 4 5 6; do
            headers="${RUNNER_TEMP}/engineering-mcp-headers-${attempt}.txt"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" \
              --header 'Accept: application/json' \
              --write-out '%{http_code}' \
              https://mcp.internal.rallywith.ai/mcp || true)"
            if [ "$status" = 401 ] && grep -qi '^www-authenticate:.*resource_metadata' "$headers"; then
              exit 0
            fi
            sleep 10
          done
          echo "Engineering MCP did not expose the expected OAuth challenge" >&2
          exit 1

      - name: Preserve exact deployment startup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-worker-deployment-startup-profiles-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            apps/api/dist/startup.cpuprofile
            apps/api/dist-eu/startup.cpuprofile
            apps/api/dist-documents/startup.cpuprofile
            apps/api/dist-documents-eu/startup.cpuprofile
            apps/api/dist-terminal/startup.cpuprofile
            apps/api/dist-terminal-eu/startup.cpuprofile
            apps/api/dist-pricing/startup.cpuprofile

      - name: Record the remaining manual release gates
        if: success()
        run: |
          # GITHUB_SHA is the dispatching ref, which is not the checked-out
          # commit when inputs.ref names a different branch, tag, or SHA.
          deployed_sha="$(git rev-parse HEAD)"
          {
            echo "### Avalon API deployed"
            echo ""
            echo "- Revision: \`${{ inputs.ref || github.ref_name }}\` (${deployed_sha})"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Regions: EU \`${DEPLOY_EU}\`, Global \`${DEPLOY_GLOBAL}\`"
            echo "- Remote migrations applied: \`${APPLY_MIGRATIONS}\`"
            echo "- Cloudflare rollout mode: \`${{ steps.deploy_mode.outputs.mode }}\`"
            echo "- Rollout reason: ${{ steps.deploy_mode.outputs.reason }}"
            echo ""
            echo "Remaining human acceptance gates from docs/runbook.md (steps 8-13):"
            echo ""
            echo "1. Workspace invitation to a real inbox and email-bound acceptance."
            echo "2. Google identity login in a provider test account."
            echo "3. Google Mail + Calendar connector reads/writes, then delete the fixtures."
            echo "4. Google Drive + Docs + Sheets connector reads/writes against disposable fixtures."
            echo "5. Drive poll baseline, change, re-poll for \`docs.document_changed\` and \`sheets.spreadsheet_changed\`."
            echo "6. Create an automation, run it manually, confirm one work stream and run record survive a retry."
          } >> "$GITHUB_STEP_SUMMARY"
