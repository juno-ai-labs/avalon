name: Release Rally Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'config/design-tokens/**'
      - 'patches/react-native-bottom-tabs*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mobile-production
  cancel-in-progress: false
  queue: single

jobs:
  release:
    runs-on: ubuntu-latest
    environment: mobile-production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @rally/mobile test
      - run: pnpm --filter @rally/browser test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build or update the production runtime
        working-directory: apps/mobile
        run: eas workflow:run release.yml --non-interactive --wait
