name: Deploy Avalon Ace

on:
  push:
    branches: [main]
    paths:
      # The Worker, browser bundle, package/configuration, and every future
      # runtime asset live below apps/ace. Tests stay on CI and do not change
      # the deployed application.
      - "apps/ace/**"
      - "!apps/ace/test/**"
      # Ace compiles this verifier directly into its Worker.
      - "apps/migration-tracker/src/access.ts"
      # Runtime contracts are a bundle input; contract tests are not.
      - "packages/contracts/**"
      - "!packages/contracts/src/**/*.test.ts"
      # Ace executes the shared request queries and download-grant issuer.
      - "packages/db/src/**"
      - "!packages/db/src/**/*.test.ts"
      - "packages/db/package.json"
      # Dependency resolution and the shared compiler configuration can change
      # Ace's emitted bundle without touching apps/ace itself.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      # These are the deployment-time modules the workflow executes directly
      # or transitively. Their tests run in CI without redeploying production.
      - "scripts/ensure-cloudflare-queues.mjs"
      - "scripts/entry-point.mjs"
      - "scripts/wrangler-config.mjs"
      - ".github/workflows/deploy-ace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ace
  cancel-in-progress: false
  queue: single

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: api-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACE_FLAGSHIP_API_TOKEN: ${{ secrets.ACE_FLAGSHIP_API_TOKEN }}
      ACE_RALLY_OPERATOR_TOKEN: ${{ secrets.ACE_RALLY_OPERATOR_TOKEN }}
      ACE_RALLY_EU_OPERATOR_TOKEN: ${{ secrets.ACE_RALLY_EU_OPERATOR_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Require Cloudflare deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${ACE_FLAGSHIP_API_TOKEN:-}" || { echo "ACE_FLAGSHIP_API_TOKEN secret is not set"; exit 1; }
          test -n "${ACE_RALLY_OPERATOR_TOKEN:-}" || { echo "ACE_RALLY_OPERATOR_TOKEN secret is not set"; exit 1; }
          test -n "${ACE_RALLY_EU_OPERATOR_TOKEN:-}" || { echo "ACE_RALLY_EU_OPERATOR_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the merged revision
        run: |
          pnpm lint
          pnpm typecheck
          pnpm --filter @rally/ace test
          pnpm --filter @rally/ace build
          pnpm test:scripts

      - name: Ensure every declared Queue exists
        run: node scripts/ensure-cloudflare-queues.mjs

      # This one command is the complete Ace release transaction. It clones the
      # migration site's Access policy into an Ace-specific application,
      # ensures both off-by-default Flagship flags, injects the returned Access
      # audience, proves the runtime token can peek a dynamically selected
      # Queue, deploys the Worker/assets/consumer, and installs that token as an
      # encrypted Worker secret. The existing
      # GitHub secret name is retained for compatibility; its token is scoped to
      # Flagship Write and Queues Edit, never deployment or Access permissions.
      - name: Provision and deploy Ace
        run: pnpm --filter @rally/ace run deploy

      - name: Verify Cloudflare Access protects Ace
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://ace.internal.rallywith.ai/ || true)"
            if [ "$status" = "302" ]; then exit 0; fi
            echo "Attempt $attempt returned HTTP $status; waiting for deployment propagation"
            sleep 10
          done
          echo "Ace did not redirect an unauthenticated request through Cloudflare Access" >&2
          exit 1
