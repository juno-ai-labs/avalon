name: Release Avalon for macOS

on:
  # A tag is an artifact of a release, not an input to one: nothing triggers on
  # `v*`, and the planner never reads tags. The workspace version measured
  # against the published record decides, so pushing a tag by hand records
  # nothing and starts nothing.
  push:
    branches:
      - main
    # Unfiltered by path: the planner is cheap, and the version gate is the
    # real filter.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag to release
        required: true
        type: string
      skip_health_gate:
        description: Publish even if a regional API health check fails (emergency use only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Concurrency lives on the release job, not here. At workflow level it would
# also cover the planner, so a push that plans a skip would still occupy the
# single pending slot and could displace a queued release that had work to do.
# Keeping the planner outside the queue means only runs that actually release
# contend for it, and a plan is never delayed behind a 90-minute release.

jobs:
  # Decides the release on a cheap runner so ordinary merges never occupy a
  # macOS runner just to discover they have nothing to ship.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      - name: Check out the full history and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan the release
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: node apps/desktop/scripts/plan-release.mjs

  release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    concurrency:
      # Signing, mutable channel promotion, and the landing-site deployment
      # form one release transaction. Serialize every tag and manual dispatch
      # globally; while one runs, keep only the newest pending release.
      # deploy-site.yml shares this group so a site deployment cannot overlap
      # a release and republish an older advertised version afterwards.
      group: desktop-macos-release
      cancel-in-progress: false
      queue: single
    # Standard macos-26 is an Apple Silicon runner. Native arm64 execution is
    # required for the clean-profile packaged launch smoke.
    runs-on: macos-26
    timeout-minutes: 90
    environment: desktop-release
    # Publishing the release tag after a verified release needs write access.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # The certificate is imported into an explicit keychain below. Keeping
      # CSC_LINK out of the packaging environment prevents electron-builder
      # from hiding the identity in a transient keychain that the final DMG
      # signing hook cannot see.
      CSC_NAME: Juno AI Labs Inc. (7ZLT6A8W25)
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: 7ZLT6A8W25
      AVALON_RELEASE_R2_BUCKET: ${{ vars.AVALON_RELEASE_R2_BUCKET }}
      AVALON_RELEASE_BASE_URL: https://downloads.with-avalon.com
      AVALON_RELEASE_PREFIX: stable/darwin/arm64
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.ref }}

      # The tag is created locally so every downstream guard sees it, but it is
      # not pushed until the release has actually published. A failed run
      # therefore leaves no tag behind and the next attempt can retry the same
      # version.
      - name: Create the release tag locally
        if: needs.plan.outputs.create_tag == 'true'
        shell: bash
        # Annotated, to match every tag released by hand before this.
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" -m "Avalon ${RELEASE_TAG#v}" HEAD

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Select Xcode with Icon Composer support
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | grep -F "Xcode 26.3"
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Set deterministic release date
        shell: bash
        run: |
          release_epoch="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          echo "SOURCE_DATE_EPOCH=${release_epoch}" >> "$GITHUB_ENV"

      - name: Guard tag, commit, and package versions
        run: node apps/desktop/scripts/validate-release-tag.mjs "$RELEASE_TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release invariants
        run: pnpm --filter @avalon/desktop test:release

      - name: Import the Developer ID identity into a shared signing keychain
        shell: bash
        env:
          AVALON_CSC_LINK: ${{ secrets.CSC_LINK }}
          AVALON_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/avalon-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          source_p12="$RUNNER_TEMP/avalon-signing-source.p12"
          identity_pem="$RUNNER_TEMP/avalon-signing-identity.pem"
          legacy_p12="$RUNNER_TEMP/avalon-signing-legacy.p12"
          echo "AVALON_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$AVALON_CSC_LINK" | openssl base64 -d -A > "$source_p12"
          chmod 600 "$source_p12"
          test -s "$source_p12"
          openssl pkcs12 \
            -in "$source_p12" \
            -password "pass:$AVALON_CSC_KEY_PASSWORD" \
            -info \
            -noout

          # Keychain import remains more reliable with the legacy PKCS#12
          # profile than with modern PBES2 exports from Keychain Access.
          openssl pkcs12 \
            -in "$source_p12" \
            -password "pass:$AVALON_CSC_KEY_PASSWORD" \
            -nodes \
            -out "$identity_pem"
          openssl pkcs12 \
            -export \
            -in "$identity_pem" \
            -password "pass:$AVALON_CSC_KEY_PASSWORD" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out "$legacy_p12"
          rm -f "$identity_pem" "$source_p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$legacy_p12" \
            -k "$keychain" \
            -P "$AVALON_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$legacy_p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null

          # Both electron-builder and the afterAllArtifactBuild codesign call
          # discover this same identity through the user search list.
          security list-keychains -d user -s \
            "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          matches="$(printf '%s\n' "$identities" | grep -F -c 'Developer ID Application: Juno AI Labs Inc. (7ZLT6A8W25)' || true)"
          test "$matches" = 1

      - name: Build, sign, notarize, staple, and verify
        run: pnpm --filter @avalon/desktop package:release

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Avalon-${{ env.RELEASE_TAG }}-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/desktop/release/release/*.dmg
            apps/desktop/release/release/*.zip
            apps/desktop/release/release/*.blockmap
            apps/desktop/release/release/latest-mac.yml
            apps/desktop/release/release/SHA256SUMS

      # A failed regional health check blocks desktop distribution for that
      # region, so the gate runs after the verified build and before anything
      # reaches the update channel.
      - name: Verify regional API health before distributing
        if: ${{ !inputs.skip_health_gate }}
        run: node scripts/check-regional-health.mjs eu global

      - name: Publish immutable payloads and promote the release manifest
        shell: bash
        run: AVALON_RELEASE_PUBLISH_CONFIRM="${RELEASE_TAG#v}" pnpm --filter @avalon/desktop release:publish:r2

      # Immediately after promotion, and before the site deploy: from here the
      # release is live to updaters, so anything that fails later must stay
      # recoverable. An untagged live release is not — it cannot be re-run
      # (the immutable-bytes guard rejects a fresh build) and cannot be
      # dispatched (there is no tag). Pushing with GITHUB_TOKEN does not start
      # another workflow run, so this cannot re-enter the release.
      - name: Publish the release tag
        if: needs.plan.outputs.create_tag == 'true'
        shell: bash
        run: git push origin "refs/tags/$RELEASE_TAG"

      # The publisher rewrote apps/site/release.config.json on this runner, and
      # the runner is about to be reclaimed. main must learn the new version:
      # publish-r2-release.mjs reads the committed copy through
      # assertNextReleaseVersion, so a stale one rejects the *next* release
      # outright, and check-site-release-config.mjs fails every later site
      # deploy against the live channel.
      - name: Record the published release config on the default branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          config=apps/site/release.config.json
          cp "$config" "$RUNNER_TEMP/release.config.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-config-sync origin/main
            # Never move the recorded release backwards: a dispatch replaying an
            # older tag must not overwrite a newer published config.
            recorded="$(node -p "require('./$config').version")"
            if ! node -e '
              const [recorded, released] = process.argv.slice(1);
              const part = (value) => value.replace(/^v/u, "").split(".").map(Number);
              const [a, b] = [part(recorded), part(released)];
              const older = a[0] !== b[0] ? a[0] < b[0] : a[1] !== b[1] ? a[1] < b[1] : a[2] < b[2];
              process.exit(older ? 0 : 1);
            ' "$recorded" "$RELEASE_VERSION"; then
              echo "main already records ${recorded}; leaving it alone"
              exit 0
            fi

            cp "$RUNNER_TEMP/release.config.json" "$config"
            git add "$config"
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Record Avalon ${RELEASE_VERSION#v} release config"
            if git push origin HEAD:main; then
              echo "recorded ${RELEASE_VERSION#v} on main"
              exit 0
            fi
            echo "main moved during attempt ${attempt}; retrying"
          done
          echo "Could not record the release config on main after 3 attempts" >&2
          exit 1

      - name: Deploy the landing site with the verified release
        run: pnpm --filter @avalon/site run deploy

      - name: Remove the temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${AVALON_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$AVALON_SIGNING_KEYCHAIN" || true
          fi
