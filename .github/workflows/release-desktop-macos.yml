name: Release Rally for macOS

on:
  # A tag is an artifact of a release, not an input to one: nothing triggers on
  # `v*`, and the planner never reads tags. The recorded release decides, so
  # pushing a tag by hand records nothing and starts nothing.
  push:
    branches:
      - main
    # What the installed application is built from. A docs, Worker, or landing
    # site merge changes nothing a user could install, so it must not spend a
    # 90-minute signed and notarized build.
    #
    # This list is the release trigger, so it is the thing to check first when a
    # merge does not release: a push that matches nothing here produces no run
    # at all, not a run that explains itself. `docs/runbook.md` documents that
    # diagnosis, and release-workflow.test.mjs pins the list.
    #
    # Keep in sync with the Documentation note in docs/runbook.md. A path filter
    # is evaluated against the push's own diff, which GitHub does not guarantee
    # to compute for very large pushes; when it cannot, the workflow runs, and
    # the planner's check for work since the last release decides instead.
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/release-desktop-macos.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag to release
        required: true
        type: string
      skip_health_gate:
        description: Publish even if a regional API health check fails (emergency use only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Concurrency covers the whole run, planner included, because *when* the plan is
# made is part of the decision. Signing, mutable channel promotion, and the
# landing-site deployment form one release transaction, so a running release is
# never cancelled; newer releases supersede older *pending* ones, since the
# newest pending run carries the newest work.
#
# Planning inside the queue is what makes the plan trustworthy. A plan made
# while another release is in flight reads a release record that run has not
# finished writing: it would compute a version that release is about to take,
# and could not tell a genuine resume of a failed release from a version that
# had just shipped. Waiting for the slot means the record is settled before it
# is read, and nothing downstream has to reason about a stale plan.
#
# It costs what it used to buy: a plan now waits behind a 90-minute release
# before it can even skip. That is affordable because the `paths:` filter above
# already keeps non-desktop merges out of the workflow entirely, so the runs
# that queue here are release candidates rather than ordinary merges.
#
# This group holds releases only. The site deployment deliberately keeps its
# own, because a queued site job sharing this one would satisfy `single` by
# cancelling a pending release.
concurrency:
  group: desktop-macos-release
  cancel-in-progress: false
  queue: single

jobs:
  # Decides the release on a cheap runner so ordinary merges never occupy a
  # macOS runner just to discover they have nothing to ship.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
    steps:
      # The planner diffs the working tree against the commit the last release
      # was built from, so the whole history has to be present.
      - name: Check out the full history and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The plan is made from main's tip, not from the commit that triggered the
      # run. This job sits inside the release queue, so by the time it runs the
      # release ahead of it has finished and pushed its `Record Rally <version>
      # release config` commit — a record the trigger commit predates. Without
      # this fetch the planner reads the older record and cuts a version that
      # has already shipped and already carries a pushed tag.
      - name: Fetch the tip the plan is made from
        run: git fetch --no-tags origin main

      - name: Plan the release
        id: plan
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: node apps/desktop/scripts/plan-release.mjs

  release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    # Concurrency is declared at workflow level, above, so that the plan is made
    # inside the queue rather than before it.
    # Standard macos-26 is an Apple Silicon runner. Native arm64 execution is
    # required for the clean-profile packaged launch smoke.
    runs-on: macos-26
    timeout-minutes: 90
    environment: desktop-release
    # Publishing the release tag after a verified release needs write access.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      # The certificate is imported into an explicit keychain below. Keeping
      # CSC_LINK out of the packaging environment prevents electron-builder
      # from hiding the identity in a transient keychain that the final DMG
      # signing hook cannot see.
      CSC_NAME: Juno AI Labs Inc. (7ZLT6A8W25)
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: 7ZLT6A8W25
      # Repository variables are renamed by hand in the repository settings, and
      # a workflow file merges before anyone opens that page. Reading the
      # superseded name as a fallback keeps a release from failing in the window
      # between the two — with an empty bucket name, which surfaces as a publish
      # that uploads nowhere rather than as an error.
      RALLY_RELEASE_R2_BUCKET: ${{ vars.RALLY_RELEASE_R2_BUCKET || vars.AVALON_RELEASE_R2_BUCKET }}
      RALLY_GLOBAL_TELEMETRY_R2_BUCKET: ${{ vars.RALLY_GLOBAL_TELEMETRY_R2_BUCKET || vars.AVALON_GLOBAL_TELEMETRY_R2_BUCKET }}
      RALLY_EU_TELEMETRY_R2_BUCKET: ${{ vars.RALLY_EU_TELEMETRY_R2_BUCKET || vars.AVALON_EU_TELEMETRY_R2_BUCKET }}
      RALLY_RELEASE_BASE_URL: https://downloads.rallywith.ai
      RALLY_RELEASE_PREFIX: stable/darwin/arm64
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.ref }}
          # The bump below pushes to main, which the job's own GITHUB_TOKEN can
          # do. Persisting it is what makes that push possible at all — and it
          # deliberately does not start another run of this workflow.
          persist-credentials: true

      # Nobody bumps a version by hand any more: the planner chose the next
      # minor and this step stamps it onto the workspace manifests and commits
      # that bump to main, so the tag, the manifests, and the artifacts all
      # agree without anyone remembering to edit a file.
      #
      # The bump lands on main *before* the build, which is what keeps the
      # released commit an ancestor of main and therefore usable as the
      # planner's watermark. A release that fails after this point leaves main
      # bumped and unpublished; that is resumable rather than broken, because
      # the record still names the old version, so the next plan picks the same
      # next minor, finds the manifests already stamped, and rebuilds it.
      - name: Bump the workspace version and record it on the default branch
        if: needs.plan.outputs.create_tag == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            # main may have moved since the plan ran. Building its tip is
            # correct: the newer commit carries strictly more work, and the
            # version being cut does not depend on which push triggered the run.
            git reset --hard origin/main
            node apps/desktop/scripts/apply-release-version.mjs "$RELEASE_VERSION"
            if git diff --quiet; then
              # main already carries this version, which is either an earlier
              # attempt that pushed its bump and then failed before publishing —
              # a resume — or a release that shipped it and whose record this
              # plan had not seen. The pushed tag is what tells them apart: it is
              # created locally and pushed only once the release has published,
              # so a tag on the remote means those bytes are already live. Cut
              # that version again and the run dies at `git tag` a few steps
              # later with nothing but `already exists` to explain itself, and
              # would republish an existing release if it got past that.
              if [ -n "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")" ]; then
                echo "::error::${RELEASE_TAG} has already been published, so this plan was stale. Refusing to release it a second time." >&2
                exit 1
              fi
              echo "main already declares ${RELEASE_VERSION}; resuming a release that did not publish it"
              exit 0
            fi
            git add package.json apps/desktop/package.json
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Bump Rally to ${RELEASE_VERSION} for release"
            if git push origin HEAD:main; then
              echo "bumped main to ${RELEASE_VERSION}"
              exit 0
            fi
            echo "main moved during attempt ${attempt}; retrying"
          done
          echo "Could not record the version bump on main after 3 attempts" >&2
          exit 1

      # Everything downstream records or verifies this exact commit: the tag
      # points at it, and the published release config names it as the
      # watermark the next plan measures new desktop work against.
      - name: Resolve the release commit
        shell: bash
        run: echo "RALLY_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The tag is created locally so every downstream guard sees it, but it is
      # not pushed until the release has actually published. A failed run
      # therefore leaves no tag behind and the next attempt can retry the same
      # version.
      - name: Create the release tag locally
        if: needs.plan.outputs.create_tag == 'true'
        shell: bash
        # Annotated, to match every tag released by hand before this.
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" -m "Rally ${RELEASE_TAG#v}" HEAD

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Select Xcode with Icon Composer support
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | grep -F "Xcode 26.3"
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Set deterministic release date
        shell: bash
        run: |
          release_epoch="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          echo "SOURCE_DATE_EPOCH=${release_epoch}" >> "$GITHUB_ENV"

      - name: Guard tag, commit, and package versions
        run: node apps/desktop/scripts/validate-release-tag.mjs "$RELEASE_TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # ci.yml runs on the same push but cannot gate this workflow: both start
      # together, so a release could publish from a commit whose CI ultimately
      # failed. Verify here, before the build is spent.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Run release invariants
        run: pnpm --filter @rally/desktop test:release

      # This is a separate minimal packaged Electron app. It proves the exact
      # Electron version can collect a renderer minidump without a submission
      # URL, then relinquish the database so a later launch can rotate it before
      # starting a fresh handler. Keep it before signing credentials are loaded:
      # the fixture is intentionally unsigned and must never inherit release
      # authority merely to test Crashpad.
      - name: Run the packaged Crashpad lifecycle fixture
        run: pnpm --filter @rally/desktop test:crashpad

      - name: Import the Developer ID identity into a shared signing keychain
        shell: bash
        env:
          RALLY_CSC_LINK: ${{ secrets.CSC_LINK }}
          RALLY_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/rally-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          source_p12="$RUNNER_TEMP/rally-signing-source.p12"
          identity_pem="$RUNNER_TEMP/rally-signing-identity.pem"
          legacy_p12="$RUNNER_TEMP/rally-signing-legacy.p12"
          echo "RALLY_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          printf '%s' "$RALLY_CSC_LINK" | openssl base64 -d -A > "$source_p12"
          chmod 600 "$source_p12"
          test -s "$source_p12"
          openssl pkcs12 \
            -in "$source_p12" \
            -password "pass:$RALLY_CSC_KEY_PASSWORD" \
            -info \
            -noout

          # Keychain import remains more reliable with the legacy PKCS#12
          # profile than with modern PBES2 exports from Keychain Access.
          openssl pkcs12 \
            -in "$source_p12" \
            -password "pass:$RALLY_CSC_KEY_PASSWORD" \
            -nodes \
            -out "$identity_pem"
          openssl pkcs12 \
            -export \
            -in "$identity_pem" \
            -password "pass:$RALLY_CSC_KEY_PASSWORD" \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out "$legacy_p12"
          rm -f "$identity_pem" "$source_p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$legacy_p12" \
            -k "$keychain" \
            -P "$RALLY_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$legacy_p12"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null

          # Both electron-builder and the afterAllArtifactBuild codesign call
          # discover this same identity through the user search list.
          security list-keychains -d user -s \
            "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          matches="$(printf '%s\n' "$identities" | grep -F -c 'Developer ID Application: Juno AI Labs Inc. (7ZLT6A8W25)' || true)"
          test "$matches" = 1

      - name: Build, sign, notarize, staple, and verify
        run: pnpm --filter @rally/desktop package:release

      - name: Install the pinned native symbol extractor
        run: cargo install dump_syms --version 2.3.7 --locked

      - name: Publish private regional telemetry artifacts
        run: pnpm --filter @rally/desktop telemetry:publish-artifacts

      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rally-${{ env.RELEASE_TAG }}-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/desktop/release/release/*.dmg
            apps/desktop/release/release/*.zip
            apps/desktop/release/release/*.blockmap
            apps/desktop/release/release/latest-mac.yml
            apps/desktop/release/release/SHA256SUMS

      # A failed regional health check blocks desktop distribution for that
      # region, so the gate runs after the verified build and before anything
      # reaches the update channel.
      - name: Verify regional API health before distributing
        if: ${{ !inputs.skip_health_gate }}
        run: node scripts/check-regional-health.mjs eu global

      - name: Publish immutable payloads and promote the release manifest
        shell: bash
        run: RALLY_RELEASE_PUBLISH_CONFIRM="${RELEASE_TAG#v}" pnpm --filter @rally/desktop release:publish:r2

      # Immediately after promotion, and before the site deploy: from here the
      # release is live to updaters, so anything that fails later must stay
      # recoverable. An untagged live release is not — it cannot be re-run
      # (the immutable-bytes guard rejects a fresh build) and cannot be
      # dispatched (there is no tag). Pushing with GITHUB_TOKEN does not start
      # another workflow run, so this cannot re-enter the release.
      - name: Publish the release tag
        if: needs.plan.outputs.create_tag == 'true'
        shell: bash
        run: git push origin "refs/tags/$RELEASE_TAG"

      # The publisher rewrote apps/site/release.config.json on this runner, and
      # the runner is about to be reclaimed. main must learn the new version and
      # the commit it shipped from: plan-release.mjs treats that commit as the
      # watermark for unreleased desktop work, publish-r2-release.mjs reads the
      # committed copy through assertNextReleaseVersion, so a stale one rejects
      # the *next* release outright, and check-site-release-config.mjs fails
      # every later site deploy against the live channel.
      - name: Record the published release config on the default branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          config=apps/site/release.config.json
          cp "$config" "$RUNNER_TEMP/release.config.json"

          # Committed from a separate worktree so this job's checkout is never
          # moved off the release commit it built, tagged, and recorded as the
          # watermark. The site deploy below also works from a worktree of
          # main's tip, with its own install, rather than by moving this one.
          sync="$RUNNER_TEMP/main-sync"
          rm -rf "$sync"
          cleanup() { git -C "$GITHUB_WORKSPACE" worktree remove --force "$sync" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in 1 2 3; do
            git fetch origin main
            git worktree remove --force "$sync" 2>/dev/null || true
            git worktree add --detach "$sync" origin/main
            # Never move the recorded release backwards: a dispatch replaying an
            # older tag must not overwrite a newer published config.
            recorded="$(node -p "require('$sync/$config').version")"
            if ! node -e '
              const [recorded, released] = process.argv.slice(1);
              const part = (value) => value.replace(/^v/u, "").split(".").map(Number);
              const [a, b] = [part(recorded), part(released)];
              const older = a[0] !== b[0] ? a[0] < b[0] : a[1] !== b[1] ? a[1] < b[1] : a[2] < b[2];
              process.exit(older ? 0 : 1);
            ' "$recorded" "$RELEASE_VERSION"; then
              echo "main already records ${recorded}; leaving it alone"
              exit 0
            fi

            cp "$RUNNER_TEMP/release.config.json" "$sync/$config"
            git -C "$sync" add "$config"
            git -C "$sync" -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Record Rally ${RELEASE_VERSION#v} release config"
            if git -C "$sync" push origin HEAD:main; then
              echo "recorded ${RELEASE_VERSION#v} on main"
              exit 0
            fi
            echo "main moved during attempt ${attempt}; retrying"
          done
          echo "Could not record the release config on main after 3 attempts" >&2
          exit 1

      # From here the run executes code from main's tip — commits this job
      # never built — so the signing identity is torn down first rather than
      # at the end of the job. if: always() keeps it running on every failure
      # path above too.
      - name: Remove the temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${RALLY_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$RALLY_SIGNING_KEYCHAIN" || true
          fi

      # The site deploys from the tip of main, not from this job's checkout —
      # the release commit, by now up to a build's length stale. On 2026-08-27
      # that staleness reverted a site fix in production for twenty-five
      # minutes: the fix merged and deployed through deploy-site.yml while the
      # 1.182.0 build ran, and this step then rebuilt the site from its
      # hour-old checkout. Every push-triggered deploy-site.yml run deploys a
      # commit on main, so main's freshly fetched tip is never older than one
      # of those; a manual dispatch of that workflow on another branch sits
      # outside this guarantee. The step stays after the record step above so
      # the tip carries the release config this run just committed — deploying
      # earlier would advertise the previous version.
      #
      # A fresh worktree, because this checkout must stay on the tagged
      # release commit; its own frozen install, because the tip may have moved
      # the lockfile; filtered to the site's dependency closure — a
      # two-project scope instead of the whole workspace, which keeps
      # Electron and the desktop toolchain out of a step that runs after the
      # release is already live, though wrangler and vite are site
      # dependencies, so workerd and esbuild still install here and run their
      # allowed build scripts; and --fail-if-no-match, because a filter that
      # matches nothing exits 0 and a green run would deploy no site at all.
      # The site's typecheck and tests cover the one change no other workflow
      # verifies: the record commit above is pushed with GITHUB_TOKEN, whose
      # pushes start no runs, so the site tests here are the only check that
      # asserts on the committed release config before it ships. Deliberately
      # no workspace-wide lint or typecheck: an unrelated package must not
      # fail a live release's final step. The live-channel guard is the same
      # last-line check deploy-site.yml runs, kept so both deploy paths
      # verify the advertised version the same way; it fails open on network
      # errors.
      #
      # Why the deploy stays inside this run at all, and the alternatives
      # rejected, are recorded in docs/runbook.md under "How the site learns
      # the desktop version".
      - name: Deploy the landing site from the tip of main
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site-deploy"
          cleanup() {
            git -C "$GITHUB_WORKSPACE" worktree remove --force "$site" 2>/dev/null || true
            rm -rf "$site"
          }
          trap cleanup EXIT
          cleanup
          git fetch origin main
          git worktree add --detach "$site" origin/main
          pnpm -C "$site" install --frozen-lockfile --filter "@rally/site..." --fail-if-no-match
          pnpm -C "$site" --filter @rally/site --fail-if-no-match typecheck
          pnpm -C "$site" --filter @rally/site --fail-if-no-match test
          node "$site/scripts/check-site-release-config.mjs"
          pnpm -C "$site" --filter @rally/site --fail-if-no-match run deploy
