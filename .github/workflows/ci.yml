name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            env:
              NODE_OPTIONS: --max-old-space-size=8192
            command: pnpm lint
          - name: typecheck-and-build-invariants
            env:
              NODE_OPTIONS: --max-old-space-size=8192
            command: >-
              pnpm typecheck &&
              pnpm --filter @rally/api build &&
              pnpm --filter @rally/api build:eu &&
              pnpm --filter @rally/desktop test:release
          - name: desktop-tests-1-of-n
            command: pnpm --filter @rally/desktop exec vitest run --shard=1/2
          - name: desktop-tests-2-of-n
            command: pnpm --filter @rally/desktop exec vitest run --shard=2/2
          - name: api-tests-1-of-n
            command: pnpm --filter @rally/api exec vitest run --shard=1/3
          - name: api-tests-2-of-n
            command: pnpm --filter @rally/api exec vitest run --shard=2/3
          - name: api-tests-3-of-n
            command: pnpm --filter @rally/api exec vitest run --shard=3/3
          - name: api-tests-workers-1-of-n
            command: pnpm --filter @rally/api exec vitest run --config vitest.workers.config.ts --shard=1/2
          - name: api-tests-workers-2-of-n
            command: pnpm --filter @rally/api exec vitest run --config vitest.workers.config.ts --shard=2/2
          - name: crash-symbolicator-container
            command: pnpm --filter @rally/api test:crash-symbolicator-container
          - name: remaining-tests
            command: >-
              pnpm --filter '!@rally/desktop' --filter '!@rally/api' --recursive --if-present test &&
              pnpm test:scripts
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The symbolicator image compiles `minidump-stackwalk` from source, which
      # costs about three and a half minutes and depends on nothing in this
      # repository. `install: true` points the plain `docker build` the lane's
      # own script runs at this cache-capable `docker-container` builder, so the
      # warm-up below and that build share one BuildKit cache.
      - name: Use a cache-capable container builder
        if: matrix.name == 'crash-symbolicator-container'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # This step is the only thing that touches the shared cache: it imports
      # the compiled layer, rebuilds it when the Dockerfile has moved, and
      # exports it again. The build that follows names no cache and resolves
      # every layer from the builder's now-warm local cache.
      #
      # `load: true` is what makes that possible, and it is not incidental. A
      # remote cache import is lazy: it resolves cache keys without fetching the
      # layers behind them, and BuildKit keeps that only for the solve it was
      # imported for. A `type=cacheonly` warm-up therefore left nothing a later,
      # separate `docker build` could reuse — it reported every vertex CACHED in
      # 2.4s and the lane then recompiled the crate from scratch anyway.
      # Materializing the image forces the layers down and into the builder's
      # local cache, which is the state the next build actually hits. The tag is
      # a side effect; nothing consumes it.
      #
      # It has to be an action rather than a `docker buildx build` line. The
      # `type=gha` backend authenticates with `ACTIONS_RUNTIME_TOKEN`, which the
      # runner injects into JavaScript actions and never into a `run:` step, so
      # driving the cache from the lane's script imported and exported nothing.
      - name: Warm the symbolicator image cache
        if: matrix.name == 'crash-symbolicator-container'
        uses: docker/build-push-action@v6
        with:
          context: apps/api/crash-symbolicator
          platforms: linux/amd64
          load: true
          tags: avalon-crash-symbolicator:warm
          cache-from: type=gha,scope=crash-symbolicator
          cache-to: type=gha,mode=max,scope=crash-symbolicator

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keep one stable required check while the expensive work fans out above.
  # `always()` makes this job report a failure instead of being skipped when a
  # matrix lane fails or is cancelled. That deliberately leaves a red verify
  # on a superseded PR revision: a skipped required check would count as green.
  verify:
    name: verify
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned deliberately: a secret-scanning gate should not change under the
      # release without review. Bump after checking the release notes.
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Check out the full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Run the configured Gitleaks gate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect --config .gitleaks.toml --redact --no-banner --verbose
