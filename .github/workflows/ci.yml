name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseding a pull request run is free; superseding a main run is not.
  # Under continuous deployment a merge reaches production, and the
  # full-history Gitleaks gate exists nowhere else, so main runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: verify / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: pnpm lint
          - name: typecheck-and-build-invariants
            command: >-
              pnpm typecheck &&
              pnpm --filter @avalon/api build &&
              pnpm --filter @avalon/api build:eu &&
              pnpm --filter @avalon/desktop test:release
          - name: desktop-tests-1-of-2
            command: pnpm --filter @avalon/desktop exec vitest run --shard=1/2
          - name: desktop-tests-2-of-2
            command: pnpm --filter @avalon/desktop exec vitest run --shard=2/2
          - name: api-tests-1-of-2
            command: pnpm --filter @avalon/api exec vitest run --shard=1/2
          - name: api-tests-2-of-2
            command: >-
              pnpm --filter @avalon/api exec vitest run --shard=2/2 &&
              pnpm --filter @avalon/api test:workers
          - name: remaining-tests
            command: >-
              pnpm --filter '!@avalon/desktop' --filter '!@avalon/api' --recursive --if-present test &&
              pnpm test:scripts
    steps:
      - name: Check out the revision
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keep one stable required check while the expensive work fans out above.
  # `always()` makes this job report a failure instead of being skipped when a
  # matrix lane fails or is cancelled. That deliberately leaves a red verify
  # on a superseded PR revision: a skipped required check would count as green.
  verify:
    name: verify
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned deliberately: a secret-scanning gate should not change under the
      # release without review. Bump after checking the release notes.
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Check out the full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Run the configured Gitleaks gate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect --config .gitleaks.toml --redact --no-banner --verbose
