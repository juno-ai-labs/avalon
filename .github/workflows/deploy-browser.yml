name: Deploy Rally browser

on:
  push:
    branches: [main]
    paths:
      - "apps/browser/**"
      # The browser imports the desktop collaboration surface and its theme.
      - "apps/desktop/**"
      - "packages/**"
      - "config/regions.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-browser
  cancel-in-progress: false
  queue: single

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Same build/check scope and deployment budget as deploy-site.
    timeout-minutes: 20
    # Reuse the existing web deployment environment and Cloudflare credentials.
    environment: site-production
    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test browser transport and assets
        run: pnpm --filter @rally/browser test
      - name: Deploy browser app and custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @rally/browser run deploy
      - name: Verify public entry routes
        run: |
          set -euo pipefail
          # Reuse the Custom Domain propagation window from deploy-ace.
          for path in / /invite /login/email /app/global; do
            ready=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error "https://app.rallywith.ai${path}" -o "$RUNNER_TEMP/rally-browser-entry.html" &&
                cmp --silent apps/browser/dist/index.html "$RUNNER_TEMP/rally-browser-entry.html"; then
                ready=true
                break
              fi
              echo "Attempt $attempt: $path does not yet serve the deployed browser build"
              sleep 10
            done
            if [ "$ready" != true ]; then
              echo "Browser entry $path did not serve the deployed build" >&2
              exit 1
            fi
          done
