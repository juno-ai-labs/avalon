name: Deploy Avalon site

# The landing site deploys independently from desktop releases. Its download
# link targets the canonical installer object, which the release publisher
# advances without rebuilding this Worker.

on:
  push:
    branches:
      - main
    paths:
      - "config/regions.json"
      - "apps/site/**"
      # Desktop publication owns this durable record; the site neither reads
      # nor renders it.
      - "!apps/site/release.config.json"
      # The site compiles shared contracts in: auth-handoff validates OAuth
      # callbacks against ConnectorOAuthProviders, so adding a provider must
      # reach the site as well as the API, or production rejects the new
      # provider's callback until an unrelated site change ships.
      - "packages/**"
      - "pnpm-lock.yaml"
      # The site's tsconfig extends the root config, and the workspace file
      # decides which install build scripts run — a merge touching either
      # changes what this workflow builds, so it must redeploy and verify the
      # site.
      - "tsconfig.base.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the newest pending site revision without interrupting a publish that
  # has already started.
  group: deploy-site
  cancel-in-progress: false
  queue: single

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: site-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Require Cloudflare deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # ci.yml runs on the same push but cannot gate this workflow, so the
      # deployment verifies the workspace itself rather than racing it.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test the site
        run: pnpm --filter @rally/site test

      - name: Deploy the site
        run: pnpm --filter @rally/site run deploy

      - name: Verify Apple association
        run: node scripts/check-apple-app-association.mjs
