name: Deploy Avalon site

# The landing site also ships as the last step of a desktop release, which is
# what publishes a new version's download. This workflow covers the other case:
# a copy, layout, or page change that has no release to ride along with.

on:
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      # The site compiles shared contracts in: auth-handoff validates OAuth
      # callbacks against ConnectorOAuthProviders, so adding a provider must
      # reach the site as well as the API, or production rejects the new
      # provider's callback until an unrelated site change ships.
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately the desktop release's group, not one of its own. A release
  # deploys the site as its final step, from the release.config.json it just
  # rewrote. A standalone site deployment running alongside it would build from
  # the older committed config and could land afterwards, restoring the
  # superseded version on the live site. Sharing the group makes the two
  # strictly ordered; while one runs, only the newest pending commit is kept.
  group: desktop-macos-release
  cancel-in-progress: false
  queue: single

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: site-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Require Cloudflare deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the site
        run: pnpm --filter @avalon/site typecheck

      - name: Test the site
        run: pnpm --filter @avalon/site test

      # The site advertises the version in apps/site/release.config.json. A
      # release rewrites that file on its own runner, so a site deploy from an
      # uncommitted release would advertise the superseded version.
      - name: Check the advertised release against the live channel
        run: node scripts/check-site-release-config.mjs

      - name: Deploy the site
        run: pnpm --filter @avalon/site run deploy
