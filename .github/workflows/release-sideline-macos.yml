name: Release Sideline for macOS

on:
  push:
    branches:
      - main
    # The installed Sideline app, the shared source it bundles, and the release
    # helpers that produce its signed update payload. The planner checks the
    # complete diff from the last Sideline tag after entering the release queue,
    # so a collapsed run cannot strand an earlier relevant change.
    paths:
      - 'apps/sideline/**'
      - 'apps/desktop/scripts/apple-notarization.mjs'
      - 'apps/desktop/scripts/apply-release-version.mjs'
      - 'apps/desktop/scripts/blockmap.mjs'
      - 'apps/desktop/scripts/entry-point.mjs'
      - 'apps/desktop/scripts/finalize-macos-release.mjs'
      - 'apps/desktop/scripts/release-cache.mjs'
      - 'apps/desktop/scripts/release-cloudflare.mjs'
      - 'apps/desktop/scripts/release-lib.mjs'
      - 'packages/contracts/**'
      - 'packages/ui/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/release-sideline-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideline-macos-release
  cancel-in-progress: false
  queue: single

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      should_release: ${{ steps.stamp.outputs.should_release }}
      commit: ${{ steps.stamp.outputs.commit }}
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
      requires_api_deploy: ${{ steps.stamp.outputs.requires_api_deploy }}
      api_deployment_ref: ${{ steps.stamp.outputs.api_deployment_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      # A different release workflow can stamp main after this run starts.
      # Replan on the fetched tip after a lost push, including the API gate.
      - name: Plan and stamp the Sideline release
        id: stamp
        run: node apps/sideline/scripts/stamp-release.mjs

      - uses: pnpm/action-setup@v4
        if: steps.stamp.outputs.should_release == 'true'
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.stamp.outputs.should_release == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.stamp.outputs.should_release == 'true'

      - name: Lint
        if: steps.stamp.outputs.should_release == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm lint

      - name: Typecheck
        if: steps.stamp.outputs.should_release == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm typecheck

      - name: Test Sideline
        if: steps.stamp.outputs.should_release == 'true'
        run: pnpm --filter @rally/sideline test

      - name: Require the matching API deployment for shared contracts
        if: steps.stamp.outputs.should_release == 'true' && steps.stamp.outputs.requires_api_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIDELINE_API_DEPLOYMENT_REF: ${{ steps.stamp.outputs.api_deployment_ref }}
        run: |
          set -euo pipefail
          while true; do
            run_id=""
            run_status=""
            run_conclusion=""
            # Newest first. The branch and event query filters can omit a run
            # that was just created, so filter here instead. A run whose commit
            # is an ancestor of the contract commit was pushed before it, and so
            # was every older run: stop there rather than walk all history.
            while IFS=$'\t' read -r candidate_id candidate_sha candidate_status candidate_conclusion; do
              if git merge-base --is-ancestor "$SIDELINE_API_DEPLOYMENT_REF" "$candidate_sha"; then
                run_id="$candidate_id"
                run_status="$candidate_status"
                run_conclusion="$candidate_conclusion"
                break
              fi
              if git merge-base --is-ancestor "$candidate_sha" "$SIDELINE_API_DEPLOYMENT_REF"; then
                break
              fi
            done < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-api.yml/runs?per_page=20" \
              --jq '.workflow_runs[] | select(.head_branch == "main" and .event == "push") | [.id, .head_sha, .status, (.conclusion // "")] | @tsv')

            # Every contract change matches deploy-api.yml's paths, so its run
            # exists and is not listed yet. The job's timeout bounds the wait.
            # 30 s set by Adam (2026-09-28): about 90 GITHUB_TOKEN calls over a
            # full 45-minute wait, against 1,000 an hour.
            if [[ -z "$run_id" ]]; then
              echo "No listed main-line API deployment contains contract commit ${SIDELINE_API_DEPLOYMENT_REF} yet; checking again" >&2
              sleep 30
              continue
            fi
            if [[ "$run_status" == "completed" ]]; then
              if [[ "$run_conclusion" == "success" ]]; then
                break
              fi
              if [[ "$run_conclusion" == "cancelled" ]]; then
                sleep 5
                continue
              fi
              echo "API deployment run ${run_id} completed with ${run_conclusion}" >&2
              exit 1
            fi
            if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
              break
            fi
            run_conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
            if [[ "$run_conclusion" != "cancelled" ]]; then
              exit 1
            fi
          done

  release:
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs['artifact-id'] }}
    env:
      CSC_NAME: Juno AI Labs Inc. (7ZLT6A8W25)
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: 7ZLT6A8W25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: true

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Set deterministic release date
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import Developer ID identity
        shell: bash
        env:
          RALLY_CSC_LINK: ${{ secrets.CSC_LINK }}
          RALLY_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sideline-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          source_p12="$RUNNER_TEMP/sideline-signing-source.p12"
          identity_pem="$RUNNER_TEMP/sideline-signing-identity.pem"
          legacy_p12="$RUNNER_TEMP/sideline-signing-legacy.p12"
          printf '%s' "$RALLY_CSC_LINK" | openssl base64 -d -A > "$source_p12"
          openssl pkcs12 -in "$source_p12" -password "pass:$RALLY_CSC_KEY_PASSWORD" -nodes -out "$identity_pem"
          openssl pkcs12 -export -in "$identity_pem" -password "pass:$RALLY_CSC_KEY_PASSWORD" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out "$legacy_p12"
          rm -f "$identity_pem" "$source_p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$legacy_p12" -k "$keychain" -P "$RALLY_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$legacy_p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          test "$(printf '%s\n' "$identities" | grep -F -c 'Developer ID Application: Juno AI Labs Inc. (7ZLT6A8W25)' || true)" = 1

      - name: Build, sign, notarize, staple, and verify
        run: pnpm --filter @rally/sideline package:release

      - name: Preserve signed release artifacts
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sideline-${{ needs.verify.outputs.version }}-macOS
          path: apps/sideline/release/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify, release]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: desktop-release
    permissions:
      contents: write
    env:
      SIDELINE_RELEASE_R2_BUCKET: ${{ vars.RALLY_RELEASE_R2_BUCKET || vars.AVALON_RELEASE_R2_BUCKET }}
      SIDELINE_RELEASE_PREFIX: sideline/stable/darwin/arm64
      SIDELINE_RELEASE_BASE_URL: https://downloads.rallywith.ai
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: apps/sideline/release/release
          merge-multiple: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confirm the release tag is still unpublished
        shell: bash
        env:
          SIDELINE_RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/${SIDELINE_RELEASE_TAG}")" || {
            echo "${SIDELINE_RELEASE_TAG} already exists; refusing to overwrite its published artifacts" >&2
            exit 1
          }

      - name: Publish update feed and installer to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @rally/sideline release:publish

      - name: Record the published release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" -m "Sideline ${RELEASE_TAG#sideline-v}" HEAD
          git push origin "refs/tags/${RELEASE_TAG}"
