name: Release Sideline for macOS

on:
  push:
    branches:
      - main
    # The installed Sideline app, the shared source it bundles, and the release
    # helpers that produce its signed update payload. The planner checks the
    # complete diff from the last Sideline tag after entering the release queue,
    # so a collapsed run cannot strand an earlier relevant change.
    paths:
      - 'apps/sideline/**'
      - 'apps/desktop/scripts/apple-notarization.mjs'
      - 'apps/desktop/scripts/apply-release-version.mjs'
      - 'apps/desktop/scripts/blockmap.mjs'
      - 'apps/desktop/scripts/entry-point.mjs'
      - 'apps/desktop/scripts/finalize-macos-release.mjs'
      - 'apps/desktop/scripts/release-cache.mjs'
      - 'apps/desktop/scripts/release-cloudflare.mjs'
      - 'apps/desktop/scripts/release-lib.mjs'
      - 'packages/contracts/**'
      - 'packages/ui/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/release-sideline-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideline-macos-release
  cancel-in-progress: false
  queue: single

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      requires_api_deploy: ${{ steps.plan.outputs.requires_api_deploy }}
      api_deployment_ref: ${{ steps.plan.outputs.api_deployment_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the release watermark and current main tip
        run: git fetch --tags origin main

      - name: Plan from the tip after entering the singleton queue
        run: git checkout --detach origin/main

      - id: plan
        run: node apps/sideline/scripts/plan-release.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: true

      - name: Stamp the next Sideline patch version on main
        shell: bash
        env:
          SIDELINE_RELEASE_REF: ${{ needs.plan.outputs.ref }}
          SIDELINE_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          SIDELINE_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SIDELINE_RELEASE_REF" || {
            echo "main advanced after Sideline release planning; rerun to bind the build and API gate to the new tip" >&2
            exit 1
          }
          git reset --hard "$SIDELINE_RELEASE_REF"
          test -z "$(git ls-remote --tags origin "refs/tags/${SIDELINE_RELEASE_TAG}")" || {
            echo "${SIDELINE_RELEASE_TAG} already exists; refusing to rebuild a published version" >&2
            exit 1
          }
          node apps/sideline/scripts/apply-release-version.mjs "$SIDELINE_RELEASE_VERSION"
          if git diff --quiet; then
            echo "main already declares ${SIDELINE_RELEASE_VERSION}; resuming its unpublished release"
          else
            git add apps/sideline/package.json
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Bump Sideline to ${SIDELINE_RELEASE_VERSION} for release"
            git push origin HEAD:main
          fi

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm lint

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm typecheck

      - name: Test Sideline
        run: pnpm --filter @rally/sideline test

      - name: Require the matching API deployment for shared contracts
        if: needs.plan.outputs.requires_api_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIDELINE_API_DEPLOYMENT_REF: ${{ needs.plan.outputs.api_deployment_ref }}
        run: |
          set -euo pipefail
          while true; do
            run_id=""
            run_status=""
            run_conclusion=""
            while IFS=$'\t' read -r candidate_id candidate_sha candidate_status candidate_conclusion; do
              if git merge-base --is-ancestor "$SIDELINE_API_DEPLOYMENT_REF" "$candidate_sha"; then
                run_id="$candidate_id"
                run_status="$candidate_status"
                run_conclusion="$candidate_conclusion"
                break
              fi
            done < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-api.yml/runs?branch=main&event=push&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha, .status, (.conclusion // "")] | @tsv')

            test -n "$run_id" || {
              echo "No main-line API deployment contains contract commit ${SIDELINE_API_DEPLOYMENT_REF}" >&2
              exit 1
            }
            if [[ "$run_status" == "completed" ]]; then
              if [[ "$run_conclusion" == "success" ]]; then
                break
              fi
              if [[ "$run_conclusion" == "cancelled" ]]; then
                sleep 5
                continue
              fi
              echo "API deployment run ${run_id} completed with ${run_conclusion}" >&2
              exit 1
            fi
            if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
              break
            fi
            run_conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
            if [[ "$run_conclusion" != "cancelled" ]]; then
              exit 1
            fi
          done

  release:
    needs: [plan, verify]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: write
    env:
      CSC_NAME: Juno AI Labs Inc. (7ZLT6A8W25)
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: 7ZLT6A8W25
      SIDELINE_RELEASE_R2_BUCKET: ${{ vars.RALLY_RELEASE_R2_BUCKET || vars.AVALON_RELEASE_R2_BUCKET }}
      SIDELINE_RELEASE_PREFIX: sideline/stable/darwin/arm64
      SIDELINE_RELEASE_BASE_URL: https://downloads.rallywith.ai
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: true

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Set deterministic release date
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import Developer ID identity
        shell: bash
        env:
          RALLY_CSC_LINK: ${{ secrets.CSC_LINK }}
          RALLY_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sideline-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          source_p12="$RUNNER_TEMP/sideline-signing-source.p12"
          identity_pem="$RUNNER_TEMP/sideline-signing-identity.pem"
          legacy_p12="$RUNNER_TEMP/sideline-signing-legacy.p12"
          printf '%s' "$RALLY_CSC_LINK" | openssl base64 -d -A > "$source_p12"
          openssl pkcs12 -in "$source_p12" -password "pass:$RALLY_CSC_KEY_PASSWORD" -nodes -out "$identity_pem"
          openssl pkcs12 -export -in "$identity_pem" -password "pass:$RALLY_CSC_KEY_PASSWORD" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out "$legacy_p12"
          rm -f "$identity_pem" "$source_p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$legacy_p12" -k "$keychain" -P "$RALLY_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$legacy_p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identities="$(security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          test "$(printf '%s\n' "$identities" | grep -F -c 'Developer ID Application: Juno AI Labs Inc. (7ZLT6A8W25)' || true)" = 1

      - name: Build, sign, notarize, staple, and verify
        run: pnpm --filter @rally/sideline package:release

      - name: Preserve signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sideline-${{ needs.plan.outputs.version }}-macOS
          path: apps/sideline/release/release/
          if-no-files-found: error
          retention-days: 30

      - name: Confirm the release tag is still unpublished
        shell: bash
        env:
          SIDELINE_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/${SIDELINE_RELEASE_TAG}")" || {
            echo "${SIDELINE_RELEASE_TAG} already exists; refusing to overwrite its published artifacts" >&2
            exit 1
          }

      - name: Publish update feed and installer to R2
        run: pnpm --filter @rally/sideline release:publish

      - name: Record the published release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" -m "Sideline ${RELEASE_TAG#sideline-v}" HEAD
          git push origin "refs/tags/${RELEASE_TAG}"
