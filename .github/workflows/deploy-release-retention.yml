name: Deploy desktop release retention

on:
  push:
    branches: [main]
    paths:
      - "apps/release-retention/**"
      - "config/r2-bucket-settings.json"
      - "scripts/ensure-cloudflare-r2-buckets.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-release-retention.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-release-retention
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The API deployment's token already holds Workers Scripts and R2 Storage.
    environment: api-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the revision being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Require Cloudflare deployment credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the retention Worker
        run: pnpm --filter @rally/release-retention typecheck
      - name: Test the retention decisions
        run: pnpm --filter @rally/release-retention test
      # Creates the active and archive release buckets in a fresh account, with
      # the location and storage class in config/r2-bucket-settings.json.
      - name: Ensure every R2 bucket the Wrangler configs declare exists
        run: node scripts/ensure-cloudflare-r2-buckets.mjs
      - name: Deploy the retention Worker
        run: pnpm --filter @rally/release-retention run deploy
