[extend]
useDefault = true

[allowlist]
description = "Generated dependencies, build artifacts, release bundles, and local tool state"
paths = [
  '''(^|/)\.env\.local$''',
  '''(^|/)\.dev\.vars(?:\.[^/]*)?$''',
  '''(^|/)node_modules/''',
  '''(^|/)out/''',
  '''(^|/)dist(?:-[^/]+)?/''',
  '''(^|/)release/''',
  '''(^|/)coverage/''',
  '''(^|/)\.wrangler/''',
  '''(^|/)\.vite/''',
  '''(^|/)\.turbo/''',
  '''(^|/)\.pnpm-store/''',
]
