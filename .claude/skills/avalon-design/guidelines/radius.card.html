<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="row">
<div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:4px;display:grid;height:72px;padding:6px;width:72px"><span class="v">xs 4</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:5px;display:grid;height:72px;padding:6px;width:72px"><span class="v">sm 5</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:6px;display:grid;height:72px;padding:6px;width:72px"><span class="v">md 6</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:7px;display:grid;height:72px;padding:6px;width:72px"><span class="v">control 7</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:9px;display:grid;height:72px;padding:6px;width:72px"><span class="v">lg 9</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:10px;display:grid;height:72px;padding:6px;width:72px"><span class="v">card 10</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:12px;display:grid;height:72px;padding:6px;width:72px"><span class="v">xl 12</span></div><div style="align-items:end;background:var(--raised);border:1px solid var(--line);border-radius:13px;display:grid;height:72px;padding:6px;width:72px"><span class="v">2xl 13</span></div>
<div style="align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:999px;display:grid;height:72px;justify-items:center;width:72px"><span class="v">pill</span></div></div></body></html>
