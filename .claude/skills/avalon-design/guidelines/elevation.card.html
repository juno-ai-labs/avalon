<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Deep, soft, black shadows — used only on things that float" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--canvas);color:var(--ink);font-family:var(--font-sans);padding:16px}
.grid{display:grid;gap:8px}.sw{border-radius:8px;display:grid;align-content:end;height:78px;padding:8px}
.n{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em}.v{font-family:var(--font-mono);font-size:9px;opacity:.62}
.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="row" style="gap:14px;padding:12px 4px 22px">
<div style="background:#262722;border:1px solid #41423b;border-radius:10px;box-shadow:var(--shadow-composer);display:grid;height:78px;place-items:center;width:150px"><span class="v">composer</span></div>
<div style="background:#20211e;border:1px solid #3c3d38;border-radius:13px;box-shadow:var(--shadow-panel);display:grid;height:78px;place-items:center;width:150px"><span class="v">panel</span></div>
<div style="background:#292a26;border:1px solid #41423c;border-radius:8px;box-shadow:var(--shadow-menu);display:grid;height:78px;place-items:center;width:150px"><span class="v">menu</span></div>
<div style="background:#22231f;border:1px solid #42433d;border-radius:12px;box-shadow:var(--shadow-dialog);display:grid;height:78px;place-items:center;width:150px"><span class="v">dialog</span></div></div></body></html>
