<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

.row{align-items:center;display:flex;flex-wrap:wrap;gap:10px}.col{display:grid;gap:8px}.lbl{color:var(--muted-2);font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.AvalonDesignSystem_5d1c5e;
const MARK = "../../assets/brand/avalon-mark.png";

const { Avatar, AvatarStack } = NS;
const people = [{ id: '1', name: 'Adam Jarvis' }, { id: '2', name: 'Maya Lin' }, { id: '3', name: 'Tomás Rey' }, { id: '4', name: 'Priya N' }, { id: '5', name: 'Sam Okafor' }, { id: '6', name: 'Ivy Chen' }];
function Demo() {
  return (
    <div className="col" style={{ gap: 16 }}>
      <div className="col"><span className="lbl">Sizes</span>
        <div className="row"><Avatar name="Adam Jarvis" size="small" /><Avatar name="Maya Lin" size="medium" /><Avatar name="Tomás Rey" size="large" /><Avatar name="?" size="medium" /></div>
      </div>
      <div className="col"><span className="lbl">Stack with overflow</span>
        <div className="row"><AvatarStack members={people} /><AvatarStack limit={2} members={people.slice(0, 3)} /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
