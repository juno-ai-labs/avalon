appId: ai.rallywith.desktop
productName: Rally
copyright: Copyright © 2026 Juno AI Labs Inc
asar: true
artifactName: Rally-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/sign-macos-dock-plugin.mjs
afterAllArtifactBuild: ./scripts/finalize-macos-release.mjs
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
# Both schemes are declared so a build that replaces an older install keeps
# answering the `avalon://` links already circulating. `rallywithai` is the one
# every surface mints; `avalon` is registered and never emitted. The list has to
# match LEGACY_DESKTOP_DEEP_LINK_PROTOCOLS in `@rally/contracts`: the operating
# system only routes a scheme a build declared here.
protocols:
  - name: Rally desktop authentication
    schemes:
      - rallywithai
  - name: Avalon desktop authentication (legacy)
    schemes:
      - avalon
publish:
  - provider: generic
    url: https://downloads.rallywith.ai/stable/darwin/arm64
mac:
  icon: resources/icon.icon
  extraFiles:
    - from: .native-build/RallyDockTilePluginV2.docktileplugin
      to: PlugIns/RallyDockTilePluginV2.docktileplugin
  extraResources:
    - from: .native-build/app-icons
      to: app-icons
      filter:
        - "*.icns"
        - "manifest.json"
    - from: native/set-application-icon.js
      to: native/set-application-icon.js
    # Both renditions ship: `nativeImage` resolves the `@2x` sibling by name at
    # runtime, so a bundle carrying only the 1x file gives a blurry status item
    # on every Retina Mac.
    # Static TrueType faces the saved PDF embeds; see docs/message-export.md.
    - from: resources/export-fonts
      to: export-fonts
    - from: resources/menu-bar
      to: menu-bar
      filter:
        - "*.png"
    - from: .native-build/system-audio-tap.node
      to: native/system-audio-tap.node
    - from: .native-build/unified-log.node
      to: native/unified-log.node
    - from: .native-build/push-notifications.node
      to: native/push-notifications.node
  category: public.app-category.productivity
  extendInfo:
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
    NSMicrophoneUsageDescription: Rally uses the microphone only when you start dictation.
    NSAudioCaptureUsageDescription: Rally captures computer audio only when you start audio transcription.
    NSDockTilePlugIn: RallyDockTilePluginV2.docktileplugin
  hardenedRuntime: true
  forceCodeSigning: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  # Icon Composer supplies the app's adaptive asset catalog. Keep an ICNS
  # only for the disk-image volume, which still uses the legacy format.
  icon: resources/icon.icns
  # electron-builder 26 notarizes Rally.app, but not the disk image. The
  # afterAllArtifactBuild hook signs, notarizes, staples, and re-blockmaps it.
  sign: false
win:
  icon: resources/icon.png
  extraResources:
    - from: resources/icon.png
      to: icon.png
    - from: resources/export-fonts
      to: export-fonts
  target:
    - nsis
linux:
  icon: resources/icon.png
  extraResources:
    - from: resources/icon.png
      to: icon.png
    - from: resources/export-fonts
      to: export-fonts
  category: Office
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
