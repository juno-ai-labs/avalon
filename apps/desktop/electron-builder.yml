appId: app.avalon.desktop
productName: Avalon
copyright: Copyright © 2026 Avalon
asar: true
artifactName: Avalon-${version}-${os}-${arch}.${ext}
afterPack: ./scripts/sign-macos-dock-plugin.mjs
afterAllArtifactBuild: ./scripts/finalize-macos-release.mjs
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
protocols:
  - name: Avalon desktop authentication
    schemes:
      - avalon
publish:
  - provider: generic
    url: https://downloads.with-avalon.com/stable/darwin/arm64
mac:
  icon: resources/icon.icon
  extraFiles:
    - from: .native-build/AvalonDockTilePlugin.docktileplugin
      to: PlugIns/AvalonDockTilePlugin.docktileplugin
  extraResources:
    - from: .native-build/app-icons
      to: app-icons
      filter:
        - "*.icns"
    - from: native/set-application-icon.js
      to: native/set-application-icon.js
    - from: .native-build/system-audio-tap.node
      to: native/system-audio-tap.node
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: Avalon uses the microphone only when you start dictation or meeting notes.
    NSAudioCaptureUsageDescription: Avalon captures computer audio only when you record meeting notes.
    NSDockTilePlugIn: AvalonDockTilePlugin.docktileplugin
  hardenedRuntime: true
  forceCodeSigning: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  # Icon Composer supplies the app's adaptive asset catalog. Keep an ICNS
  # only for the disk-image volume, which still uses the legacy format.
  icon: resources/icon.icns
  # electron-builder 26 notarizes Avalon.app, but not the disk image. The
  # afterAllArtifactBuild hook signs, notarizes, staples, and re-blockmaps it.
  sign: false
win:
  icon: resources/icon.png
  extraResources:
    - from: resources/icon.png
      to: icon.png
  target:
    - nsis
linux:
  icon: resources/icon.png
  extraResources:
    - from: resources/icon.png
      to: icon.png
  category: Office
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
