extends: ./electron-builder.base.yml
artifactName: Rally-${version}-linux-x64.${ext}
directories:
  output: release/linux
extraMetadata:
  desktopName: ai.rallywith.desktop
  homepage: https://rallywith.ai
publish:
  - provider: generic
    url: https://downloads.rallywith.ai/stable/linux/x64
linux:
  icon: resources/icon.png
  category: Office
  syncDesktopName: true
  extraResources:
    - from: resources/icon.png
      to: icon.png
  executableName: rally
  maintainer: Juno AI Labs Inc
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  artifactName: Rally-${version}-linux-x64.${ext}

deb:
  packageName: rally
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
    - libgbm1
    - pkexec | policykit-1
