<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="{{access.description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rally" />
    <meta property="og:title" content="{{access.title}}" />
    <meta property="og:description" content="{{access.description}}" />
    <meta property="og:url" content="https://rallywith.ai/start-fast/" />
    <meta property="og:image" content="https://rallywith.ai/rally-social-v01.jpg" />
    <meta property="og:image:secure_url" content="https://rallywith.ai/rally-social-v01.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="{{access.title}}." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{access.title}}" />
    <meta name="twitter:description" content="{{access.description}}" />
    <meta name="twitter:image" content="https://rallywith.ai/rally-social-v01.jpg" />
    <meta name="twitter:image:alt" content="{{access.title}}." />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/src/landing.css" />
    <script type="module" src="/src/site-motion.ts"></script>
    <script type="module" src="/src/live-carousel.ts"></script>
    <script type="module" src="/src/explorables.ts"></script>
    <script type="module" src="/src/technology-loader.ts"></script>
    <title>{{access.title}}</title>
  </head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header"><div class="site-header-inner">
<a class="wordmark" href="#top" aria-label="Rally home"><img class="rally-symbol" src="/brand/rally-mark-ink.svg" width="24" height="24" alt="">rally</a>
<!-- rally:site-nav -->
</div></header>
<main id="content">
<section class="hero" id="top" aria-labelledby="hero-title">
<div class="hero-grid">
<p class="hero-kicker"><span>New</span>Live artifacts, shared with your team</p>
<h1 id="hero-title" class="display hero-title">{{access.headline}} <em>{{access.headlineTurn}}</em></h1>
<div class="hero-side">
<p class="intro">{{access.description}}</p>
<div class="hero-actions"><a class="button hero-web-app" data-site-action="web-app-hero" href="https://app.rallywith.ai">Use the web app</a><!-- rally:desktop-downloads --></div>
<p class="hero-note">No download needed. The Mac app is the best experience.</p>
</div>
</div>
<div class="hero-stage">
<!-- rally:live-carousel -->
</div>
</section>
<!-- rally:landing-sections -->
</main>
<!-- rally:site-footer -->

</body></html>
