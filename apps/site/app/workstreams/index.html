<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/src/desktop-handoff.css" />
    <title>Opening in Rally</title>
  </head>
  <body>
    <main class="handoff-shell">
      <section class="handoff-card" aria-labelledby="workstream-title">
        <img class="handoff-mark" src="/brand/rally-mark-ink.svg" width="56" height="56" alt="" />
        <h1 id="workstream-title">Opening in Rally</h1>
        <a aria-disabled="true" class="handoff-open" href="#" id="open-rally">Open in Rally for Mac</a>
        <a class="handoff-secondary" hidden href="#" id="open-browser">Continue in browser</a>
        <p class="handoff-help" id="workstream-help">Don’t have the Mac app? <a download href="https://downloads.rallywith.ai/stable/darwin/arm64/Rally.dmg">Download it</a>, then open this link again.</p>
        <p class="handoff-error" hidden id="workstream-error" role="alert">This link is incomplete or invalid.</p>
      </section>
    </main>
    <script type="module" src="/src/workstream-link.ts"></script>
  </body>
</html>
