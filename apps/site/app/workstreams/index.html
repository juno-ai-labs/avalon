<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111210" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Open work stream in Rally</title>
  </head>
  <body class="invite-page">
    <main class="invite-shell">
      <section class="invite-card" aria-labelledby="workstream-title">
        <a class="brand invite-brand" href="/" aria-label="Rally home">
          <img class="brand-mark" src="/brand/rally-mark.svg" width="24" height="24" alt="" />
          <span>rally</span>
        </a>
        <p class="eyebrow">Work stream</p>
        <h1 id="workstream-title">Opening this work stream in Rally</h1>
        <p id="workstream-status">This work stream opens with your existing Rally session and workspace permissions.</p>
        <a aria-disabled="true" class="button button-primary invite-open" href="#" id="open-rally">Open Rally <span class="button-arrow" aria-hidden="true">↗</span></a>
        <p class="invite-help" id="workstream-help">If the app does not open, <a href="/">install Rally</a> and return to this page.</p>
        <p class="invite-error" hidden id="workstream-error" role="alert">This work-stream link is incomplete or invalid.</p>
      </section>
    </main>
    <script type="module" src="/src/workstream-link.ts"></script>
  </body>
</html>
