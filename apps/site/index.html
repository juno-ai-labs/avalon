<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ccff00" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="{{access.description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rally" />
    <meta property="og:title" content="{{access.title}}" />
    <meta property="og:description" content="{{access.description}}" />
    <meta property="og:url" content="https://rallywith.ai/" />
    <meta property="og:image" content="https://rallywith.ai/rally-social.jpg" />
    <meta property="og:image:secure_url" content="https://rallywith.ai/rally-social.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="{{access.title}}." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{access.title}}" />
    <meta name="twitter:description" content="{{access.description}}" />
    <meta name="twitter:image" content="https://rallywith.ai/rally-social.jpg" />
    <meta name="twitter:image:alt" content="{{access.title}}." />
    <link rel="canonical" href="https://rallywith.ai/" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/access.css" />
    <script type="module" src="/src/landing.ts"></script>
    <title>{{access.title}}</title>
  </head>
  <body class="rally-home access-home">
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="rally-header"><a class="rally-wordmark" href="/" aria-label="Rally home"><img class="rally-symbol" src="/brand/rally-mark.svg" width="30" height="30" alt="" /><span>rally</span></a></header>
    <main id="content"><section class="access-intro" aria-labelledby="hero-title">
      <h1 id="hero-title">{{access.headline}}</h1>
      <p class="access-description">{{access.description}}</p>
      <p class="access-capabilities">{{access.capabilities}}</p>
      <div id="access-challenge" class="access-challenge"></div>
      <form id="access-request" class="access-form">
        <label class="sr-only" for="access-email">{{access.emailLabel}}</label>
        <input id="access-email" type="email" autocomplete="email" placeholder="{{access.emailLabel}}" required />
        <button id="access-submit" type="submit" disabled>{{access.button}}</button>
      </form>
      <p id="access-status" class="access-status" role="status" aria-live="polite" tabindex="-1"></p>
      <p class="access-availability"><em>{{access.availability}}</em></p>
      <p class="access-note">We’ll only email you about your access to Rally. <a href="/trust/privacy/">Privacy</a></p>
      <noscript>Enable JavaScript to request access.</noscript>
    </section></main>
    <footer class="rally-footer"><a class="rally-wordmark" href="/" aria-label="Rally home"><img class="rally-symbol" src="/brand/rally-mark.svg" width="30" height="30" alt="" /><span>rally</span></a><nav aria-label="Trust Center and company links"><a href="/trust/">Trust Center</a><a href="/trust/security/">Security</a><a href="/trust/privacy/">Privacy</a><a href="/trust/terms/">Terms</a><a href="/trust/dpa/">DPA</a><a href="/trust/subprocessors/">Sub-processors</a><a href="/trust/cookies/">Cookies</a><a href="/trust/acceptable-use/">Acceptable Use</a><a href="/support/">Support</a></nav><small>© 2026 Juno AI Labs · Rally</small></footer>
  </body>
</html>
