<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111210" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Return to Rally</title>
  </head>
  <body class="invite-page auth-handoff-page">
    <main class="invite-shell">
      <section class="invite-card auth-handoff-card" aria-labelledby="auth-title">
        <a class="brand invite-brand" href="/" aria-label="Rally home">
          <img class="brand-mark" src="/brand/rally-mark.svg" width="24" height="24" alt="" />
          <span>rally</span>
        </a>
        <p class="eyebrow">Secure desktop handoff</p>
        <h1 id="auth-title">Returning you to Rally</h1>
        <p id="auth-status" role="status">Checking the sign-in response…</p>
        <a aria-disabled="true" class="button button-primary invite-open" href="/" id="open-rally">
          Open Rally
          <span class="button-arrow" aria-hidden="true">↗</span>
        </a>
        <p class="invite-help" id="auth-help">
          If Rally does not open automatically, use the button above. You can safely close this page after the desktop app opens.
        </p>
        <noscript><p class="invite-error">JavaScript is required to return securely to the Rally desktop app.</p></noscript>
      </section>
    </main>
    <script type="module" src="/src/auth-handoff.ts"></script>
  </body>
</html>
