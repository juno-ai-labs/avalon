<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/src/desktop-handoff.css" />
    <title>Open Rally</title>
  </head>
  <body>
    <main class="handoff-shell">
      <section class="handoff-card" aria-labelledby="open-title">
        <img class="handoff-mark" src="/brand/rally-mark-ink.svg" width="56" height="56" alt="" />
        <h1 id="open-title">Continue in the Rally app</h1>
        <p class="handoff-status">This item uses your existing Rally session and organization permissions.</p>
        <a aria-disabled="true" class="handoff-open" href="#" id="open-rally">Open Rally</a>
        <p class="handoff-help">If the app does not open, install Rally first and return to this page.</p>
        <p class="handoff-error" hidden id="open-error" role="alert">This Rally link is incomplete or invalid.</p>
      </section>
    </main>
    <script type="module" src="/src/desktop-open.ts"></script>
  </body>
</html>
