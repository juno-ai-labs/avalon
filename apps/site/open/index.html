<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111210" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Open Avalon</title>
  </head>
  <body class="invite-page">
    <main class="invite-shell">
      <section class="invite-card" aria-labelledby="open-title">
        <a class="brand invite-brand" href="/" aria-label="Avalon home">
          <img class="brand-mark" src="/brand/avalon-mark.png" width="24" height="24" alt="" />
          <span>Avalon</span>
        </a>
        <p class="eyebrow">Desktop handoff</p>
        <h1 id="open-title">Continue in the Avalon app</h1>
        <p>This item uses your existing Avalon session and workspace permissions.</p>
        <a aria-disabled="true" class="button button-primary invite-open" href="#" id="open-avalon">Open Avalon <span class="button-arrow" aria-hidden="true">↗</span></a>
        <p class="invite-help">If the app does not open, install Avalon first and return to this page.</p>
        <p class="invite-error" hidden id="open-error" role="alert">This Avalon link is incomplete or invalid.</p>
      </section>
    </main>
    <script type="module" src="/src/desktop-open.ts"></script>
  </body>
</html>
