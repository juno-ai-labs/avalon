name: Distribute Rally Mobile to public TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Exact verified store build ID to submit
      changelog:
        type: string
        required: true
        description: What to Test notes for this build
jobs:
  submit:
    type: testflight
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
      external_groups:
        - Public Beta
      changelog: ${{ inputs.changelog }}
      submit_beta_review: true
