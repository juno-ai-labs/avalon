appId: ai.rallywith.sideline
productName: Sideline
asar: true
artifactName: "${productName}-${version}-mac-${arch}.${ext}"
directories:
  output: release/release
files:
  - out/**/*
  - package.json
protocols:
  - name: Sideline authentication callback
    schemes:
      - sideline
publish:
  provider: generic
  url: https://downloads.rallywith.ai/sideline/stable/darwin/arm64
afterAllArtifactBuild: scripts/finalize-macos-release.mjs
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  sign: false
