packages:
  - apps/*
  - packages/*

allowBuilds:
  '@openrouter/sdk': false
  core-js: false
  core-js-pure: false
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  workerd: true

peerDependencyRules:
  allowedVersions:
    "tw-fade@0.8>tailwindcss": "3.x"

overrides:
  fast-uri: 3.1.5
  "undici@>=7.0.0 <7.29.0": 7.29.0

catalog:
  typescript: ^5.9.3
  zod: latest
  vitest: latest

minimumReleaseAgeExclude:
  - '@juno-ai/bind@15.0.0 || 16.0.0'
  - '@posthog/core@1.47.1'
  - '@posthog/types@1.403.0'
  - posthog-node@5.48.2

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2

patchedDependencies:
  electron-updater@6.8.9: patches/electron-updater@6.8.9.patch
